<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>434 复习台 · 山东大学国际商务</title>
<style>
:root{
  --bg:#f5f7fb; --card:#fff; --line:#e5e8f0; --text:#1f2534; --sub:#727b8f;
  --pri:#3665f3; --pri2:#eaf0ff; --ok:#16a34a; --warn:#d99400; --bad:#e02424;
  --s:#e02424; --a:#d97706; --b:#2f7de1; --c:#8b95a8;
  --r:12px; --sh:0 1px 2px rgba(16,24,40,.04),0 4px 14px rgba(16,24,40,.05);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font:14px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font:inherit}

/* ---------- 布局 ---------- */
.app{height:100vh;display:flex;flex-direction:column;overflow:hidden}

.top{
  height:58px;flex:0 0 58px;display:flex;align-items:center;gap:24px;
  padding:0 18px;background:var(--card);border-bottom:1px solid var(--line);z-index:5;
}
.brand{font-size:16px;font-weight:700;letter-spacing:.3px;white-space:nowrap}
.brand i{color:var(--pri);font-style:normal}
.brand small{font-size:12px;font-weight:400;color:var(--sub);margin-left:8px}

.gwrap{flex:1;display:flex;align-items:center;gap:12px;max-width:520px}
.gbar{flex:1;height:8px;background:#eef1f7;border-radius:99px;overflow:hidden}
.gbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4f7cf7,#7aa2ff);transition:width .35s}
.gtxt{font-size:12px;color:var(--sub);white-space:nowrap;min-width:88px}

.dcount{font-size:13px;color:var(--sub);white-space:nowrap}
.dcount b{color:var(--bad);font-size:18px;margin:0 2px}

.body{flex:1;display:grid;grid-template-columns:268px minmax(0,1fr) 248px;overflow:hidden}

/* ---------- 左栏 ---------- */
.left{background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.searchbox{padding:10px;border-bottom:1px solid var(--line)}
.searchbox input{
  width:100%;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:8px;
  background:#fafbfd;outline:none;
}
.searchbox input:focus{border-color:var(--pri);background:#fff}

.tree{flex:1;overflow:auto;padding:6px 8px 20px}
.tnode{margin:2px 0}
.tmod{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 10px;border-radius:8px;font-weight:600;cursor:pointer;user-select:none;
}
.tmod:hover{background:#f3f6fc}
.tmod .cnt{font-size:11px;color:var(--sub);font-weight:400}
.tchs{display:none;margin-left:6px}
.tmod.open + .tchs{display:block}
.tch{
  display:flex;align-items:center;justify-content:space-between;
  padding:5px 10px;border-radius:6px;font-size:13px;color:#3b4357;cursor:pointer;
}
.tch:hover{background:#f3f6fc}
.tch .cnt{font-size:11px;color:var(--sub)}
.tkp{
  display:block;padding:4px 10px 4px 22px;font-size:12.5px;color:#5b6478;
  border-radius:6px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tkp:hover{background:#eef3ff;color:var(--pri)}
.tkp.on{background:var(--pri2);color:var(--pri);font-weight:600}
.tkp em{font-style:normal;font-size:10px;padding:0 4px;border-radius:4px;color:#fff;margin-right:4px}

/* ---------- 中栏 ---------- */
.main{overflow:auto;padding:0 22px 40px}
.tabs{
  position:sticky;top:0;z-index:4;display:flex;gap:4px;
  padding:12px 0 10px;background:linear-gradient(var(--bg) 70%,rgba(245,247,251,0));
}
.tabs button{
  padding:7px 14px;border-radius:9px;font-size:13.5px;color:#5b6478;
}
.tabs button:hover{background:#eaeefb;color:var(--pri)}
.tabs button.on{background:var(--pri);color:#fff;box-shadow:0 2px 8px rgba(54,101,243,.28)}

.view{max-width:860px}
.h1{font-size:20px;font-weight:700;margin:6px 0 4px}
.h2{font-size:15px;font-weight:700;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.h2::before{content:"";width:4px;height:15px;border-radius:2px;background:var(--pri)}
.muted{color:var(--sub);font-size:13px}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px;margin-bottom:14px}
.panel h3{margin:0 0 10px;font-size:13px;font-weight:700;color:#3b4357}

/* ---------- 徽标 ---------- */
.lv{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.5px;color:#fff;padding:1px 6px;border-radius:5px;vertical-align:2px}
.lv.s{background:var(--s)} .lv.a{background:var(--a)} .lv.b{background:var(--b)} .lv.c{background:var(--c)}
.ty{display:inline-block;font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:5px;padding:0 6px;margin-left:6px}
.src{display:inline-block;font-size:11px;color:var(--sub);margin-left:6px}

/* ---------- 组件 ---------- */
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{
  padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:#fff;
  font-size:13px;color:#3b4357;transition:.15s;
}
.btn:hover{border-color:#c9d4f0;background:#f7f9ff}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:#2a55dc}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.warn{background:var(--warn);border-color:var(--warn);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}

/* ---------- 今日台 ---------- */
.task{
  display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border:1px solid var(--line);
  border-radius:var(--r);background:var(--card);margin-bottom:10px;box-shadow:var(--sh);
}
.task .idx{
  flex:0 0 26px;height:26px;border-radius:8px;background:var(--pri2);color:var(--pri);
  display:grid;place-items:center;font-weight:700;font-size:12.5px;
}
.task .tx{flex:1;min-width:0}
.task .tx b{display:block;font-size:14px;margin-bottom:2px}
.task .tx span{font-size:12px;color:var(--sub)}
.task .why{font-size:11px;color:var(--warn);margin-top:3px}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh)}
.kpi b{display:block;font-size:22px;line-height:1.2}
.kpi span{font-size:12px;color:var(--sub)}

/* ---------- 闪卡 ---------- */
.fcWrap{display:flex;flex-direction:column;align-items:center;padding-top:8px}
.fc{
  width:100%;max-width:700px;min-height:320px;background:var(--card);border:1px solid var(--line);
  border-radius:18px;box-shadow:0 8px 30px rgba(30,45,90,.08);padding:26px 28px;
  display:flex;flex-direction:column;cursor:pointer;transition:.2s;
}
.fc:hover{box-shadow:0 12px 38px rgba(30,45,90,.12)}
.fc .fctop{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.fc .q{font-size:20px;font-weight:700;line-height:1.5;margin-bottom:16px}
.fc .a{
  font-size:14.5px;line-height:1.9;color:#39415570;border-top:1px dashed var(--line);
  padding-top:16px;white-space:pre-wrap;
}
.fc .a.show{color:#394155}
.fc .hint{margin-top:auto;font-size:12px;color:var(--sub);text-align:center;padding-top:18px}
.fcFoot{display:flex;gap:10px;margin-top:18px;width:100%;max-width:700px}
.fcFoot button{flex:1;padding:12px 0;border-radius:11px;font-weight:600;font-size:14px;border:1px solid var(--line);background:#fff}
.fcFoot .no{border-color:#f3c2c2;color:var(--bad);background:#fff7f7}
.fcFoot .mid{border-color:#f0dcae;color:var(--warn);background:#fffdf5}
.fcFoot .yes{border-color:#bde5c8;color:var(--ok);background:#f5fdf7}

/* ---------- 错题 ---------- */
.wrongItem{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:8px}
.wrongItem .tx{flex:1;min-width:0}
.wrongItem b{font-size:13.5px}
.wrongItem span{font-size:12px;color:var(--sub)}

/* ---------- 详情 ---------- */
.detail .t{font-size:22px;font-weight:700;margin:4px 0 8px}
.detail .bodytext{font-size:15px;line-height:2;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;white-space:pre-wrap;margin-top:12px}

/* ---------- 右栏 ---------- */
.right{background:var(--card);border-left:1px solid var(--line);padding:12px;overflow:auto}
.right .panel{box-shadow:none;border:none;padding:0 0 14px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.right .panel:last-child{border-bottom:none}
.prog{display:flex;flex-direction:column;gap:9px}
.prow{font-size:12px}
.prow .pt{display:flex;justify-content:space-between;margin-bottom:3px;color:#4a5368}
.prow .pb{height:6px;background:#eef1f7;border-radius:99px;overflow:hidden}
.prow .pb i{display:block;height:100%;border-radius:99px;background:var(--pri);transition:width .4s}
.prow .pb i.s{background:var(--s)}
.btncol{display:flex;flex-direction:column;gap:8px}
.btncol .btn{width:100%;text-align:left}

/* ---------- 滚动条 ---------- */
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#d6dbe7;border-radius:9px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#bcc5d8;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 响应 ---------- */
@media(max-width:1180px){
  .body{grid-template-columns:238px minmax(0,1fr)}
  .right{display:none}
}
@media(max-width:820px){
  .body{grid-template-columns:1fr}
  .left{display:none}
  .main{padding:0 14px 30px}
}
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="brand">434 <i>复习台</i><small>山大 · 国际商务专业基础</small></div>
    <div class="gwrap">
      <div class="gbar"><i id="gbar"></i></div>
      <div class="gtxt" id="gtxt">0 / 0 已掌握</div>
    </div>
    <div class="dcount" id="dcount">距初试 <b>--</b> 天</div>
  </header>

  <div class="body">

    <aside class="left">
      <div class="searchbox">
        <input id="search" placeholder="搜索考点 / 关键词…">
      </div>
      <div class="tree" id="tree"></div>
    </aside>

    <main class="main">
      <nav class="tabs" id="tabs">
        <button data-tab="today" class="on">今日台</button>
        <button data-tab="outline">提纲</button>
        <button data-tab="card">闪卡</button>
        <button data-tab="wrong">错题本</button>
        <button data-tab="stat">数据</button>
      </nav>
      <section class="view" id="view"></section>
    </main>

    <aside class="right">
      <div class="panel">
        <h3>模块进度</h3>
        <div class="prog" id="modprog"></div>
      </div>
      <div class="panel">
        <h3>数据</h3>
        <div class="btncol">
          <button class="btn sm" id="btnExport">导出备份</button>
          <button class="btn sm" id="btnImport">导入备份</button>
          <button class="btn sm" id="btnReset">清空重来</button>
        </div>
        <input type="file" id="fileIn" accept=".json" hidden>
      </div>
      <div class="panel">
        <h3>快捷键</h3>
        <div class="muted" style="font-size:12px;line-height:1.9">
          空格 / 回车：翻卡<br>
          1：忘了　2：模糊　3：记得<br>
          /：聚焦搜索
        </div>
      </div>
    </aside>

  </div>
</div>
<script>
/* ==================================================================
   434 复习台 · 核心层
   数据 → 状态 → 权重 → 事件 → 插件
   ================================================================== */

/* ---------- 1. 知识点数据 ----------
   id  : 唯一标识（不要改）
   m   : 模块 0国贸 1投资 2金融 3运营
   ch  : 章节
   t   : 标题（树里显示）
   lv  : S/A/B/C 优先级
   ty  : 名解/简答/论述/计算
   q   : 闪卡正面
   a   : 闪卡背面（\n 换行）
   src : 真题出处
------------------------------------------------------------------ */
const DATA = [
/* ========== 一、国际贸易 ========== */
{id:'t01',m:0,ch:'第1章 国际贸易理论',t:'绝对优势理论',lv:'S',ty:'名解',src:'19论述',
 q:'绝对优势理论',
 a:'亚当·斯密提出。一国在某产品上劳动生产率高于别国，即具有绝对优势；反之则为绝对劣势。各国应专业化生产并出口具有绝对优势的产品，进口不具优势的产品，结果比什么都自己生产更有利。'},

{id:'t02',m:0,ch:'第1章 国际贸易理论',t:'比较优势理论',lv:'S',ty:'论述',src:'19论述',
 q:'比较优势理论（李嘉图）',
 a:'核心：两利相权取其重，两弊相权取其轻。即使一国在两种产品上均处绝对劣势，仍可专业化生产劣势相对较小的产品，通过交换双方获益。\n评价：①奠定自由贸易的理论基础；②假设苛刻（2×2、要素不流动、技术不变、完全竞争），未解释贸易利益在国与国之间的分配。'},

{id:'t03',m:0,ch:'第1章 国际贸易理论',t:'要素禀赋论 H-O',lv:'S',ty:'简答',src:'14简答',
 q:'要素禀赋论（H-O 模型）',
 a:'①核心结论：一国应出口密集使用其相对丰裕要素生产的产品，进口密集使用其相对稀缺要素生产的产品。\n②逻辑链条：要素禀赋差异→要素价格差异→产品成本差异→比较优势→国际贸易。\n③评价：奠定了现代国际贸易理论的基础；但假设要素不能流动、技术相同，遭到里昂惕夫之谜的挑战。'},

{id:'t04',m:0,ch:'第1章 国际贸易理论',t:'里昂惕夫之谜',lv:'B',ty:'名解',src:'—',
 q:'里昂惕夫之谜（里昂惕夫悖论）',
 a:'按 H-O 模型，资本丰裕的美国应出口资本密集型产品、进口劳动密集型产品。里昂惕夫用投入产出法检验发现，美国出口的劳动密集型产品多于进口，进口的资本密集型产品多于出口，结论与要素禀赋论相反，故称悖论。'},

{id:'t05',m:0,ch:'第1章 国际贸易理论',t:'产品生命周期理论',lv:'S',ty:'名解',src:'17名解·20简答·21简答',
 q:'产品生命周期理论',
 a:'弗农提出。产品像生物一样经历创新、成熟、标准化三个阶段：\n①创新阶段：技术垄断，发明国生产并满足国内外需求；\n②成熟阶段：技术扩散，国外开始模仿生产，发明国出口下降；\n③标准化阶段：技术物化于设备，成本成为竞争关键，生产转移至低成本国家。\n评价：从技术角度解释了为何投资、能否投资、投向何处；但不能量化时间差，也难以解释美国以外的 FDI。'},

{id:'t06',m:0,ch:'第1章 国际贸易理论',t:'产业内贸易的原因',lv:'S',ty:'简答',src:'23简答·25简答',
 q:'产业内贸易的原因',
 a:'①产品差异化：同一产业内不同规格、质量、品牌的产品形成双向需求；\n②规模经济：扩大市场以降低单位成本；\n③消费者偏好的多样性；\n④跨国公司的全球价值链分工，中间品多次跨境。'},

{id:'t07',m:0,ch:'第1章 国际贸易理论',t:'战略性贸易政策',lv:'S',ty:'简答',src:'15简答·23论述',
 q:'战略性贸易政策理论',
 a:'在不完全竞争市场中，政府运用补贴或出口鼓励，扶持具有规模经济、外部经济或大量租金的产业，扩大本国厂商的国际市场份额，把超额利润从外国厂商转移给本国厂商。\n评价：①突破完全竞争假设；②但易引发报复，且政府难以识别战略性产业，补贴可能被浪费。'},

{id:'t08',m:0,ch:'第2章 贸易政策与壁垒',t:'名义/有效关税率',lv:'S',ty:'计算',src:'16名解·20名解·24计算',
 q:'名义关税率与有效保护率（含公式）',
 a:'名义保护率＝海关按税则征收的关税税率。\n有效保护率 E＝(V′－V)/V，V 为零关税时单位产品附加值，V′ 为征税后的附加值。\n关键结论：最终产品名义税率＞原材料名义税率时，有效保护率＞名义税率；反之则小于。\n政策含义：对原材料征关税等于向使用该原料的国内产业征税。'},

{id:'t09',m:0,ch:'第2章 贸易政策与壁垒',t:'非关税壁垒',lv:'S',ty:'名解',src:'14名解·18简答',
 q:'非关税壁垒',
 a:'关税以外一切限制进口的措施。分两类：\n①直接：进口配额、自动出口限制、进口许可证；\n②间接：外汇管制、进口押金、国家垄断、政府采购、国内税、国产化要求、技术标准、绿色壁垒。\n影响：数量限制扭曲价格机制，保护效果确定且隐蔽，易引发报复。'},

{id:'t10',m:0,ch:'第2章 贸易政策与壁垒',t:'进口配额',lv:'S',ty:'名解',src:'15名解',
 q:'进口配额',
 a:'一国在一定时期内对某些商品的进口数量或金额加以限制，限额内允许进口，超过限额则不准进口或征收高额关税。分全球配额与国别配额；禁止性配额与关税配额。'},

{id:'t11',m:0,ch:'第2章 贸易政策与壁垒',t:'绿色贸易壁垒',lv:'S',ty:'名解',src:'14·21',
 q:'绿色贸易壁垒',
 a:'进口国以保护自然资源、生态环境和人类健康为由，通过严格的环保技术标准、绿色标志、绿色包装、绿色检疫和绿色补贴等，限制外国产品进口的措施。具有两重性：形式上顺应环保要求，实质上是新型非关税壁垒。'},

{id:'t12',m:0,ch:'第2章 贸易政策与壁垒',t:'贸易救济',lv:'S',ty:'名解',src:'25名解',
 q:'贸易救济',
 a:'一国依据国际贸易规则对进口产品采取的三种措施：\n①反倾销：针对低于正常价值销售；\n②反补贴：针对外国政府补贴；\n③保障措施：针对进口激增造成严重损害。\n须经调查程序，受 WTO 规则约束。'},

{id:'t13',m:0,ch:'第2章 贸易政策与壁垒',t:'出口信贷',lv:'S',ty:'名解',src:'18名解',
 q:'出口信贷',
 a:'一国银行为鼓励本国商品出口，对本国出口商、外国进口商或进口方银行提供的贷款。分卖方信贷（贷给本国出口商）与买方信贷（贷给外国进口商或银行）。通常用于成套设备、船舶、飞机等大额交易。'},

{id:'t14',m:0,ch:'第2章 贸易政策与壁垒',t:'自由贸易区',lv:'S',ty:'名解',src:'18名解',
 q:'自由贸易区（FTA）',
 a:'两个或两个以上国家通过协议，相互取消进口关税及同等效力的措施而形成的区域经济一体化组织。特征：①成员间商品自由流动；②无共同对外关税；③须以原产地规则区分成员与非成员国产品。'},

{id:'t15',m:0,ch:'第2章 贸易政策与壁垒',t:'倾销与外汇倾销',lv:'B',ty:'名解',src:'—',
 q:'商品倾销与外汇倾销',
 a:'商品倾销：以低于国内市场价格甚至低于成本的价格向国外大量抛售。\n外汇倾销：以压低本币汇率的方式促进出口、抑制进口。生效条件：①贬值幅度大于国内物价上涨；②出口需求弹性大；③他国不同时等幅贬值。'},

{id:'t16',m:0,ch:'第2章 贸易政策与壁垒',t:'海关税则 / 从量税',lv:'A',ty:'名解',src:'22名解·19名解',
 q:'海关税则 / 从量税',
 a:'海关税则：一国对进出口商品计征关税的规章和对应税商品系统分类的税率表。分单式与复式。\n从量税：按进口商品的数量、重量、容量等计量单位计征的关税，税额＝数量×单位税额。'},

{id:'t17',m:0,ch:'第3章 货物与服务贸易',t:'服务贸易四种方式',lv:'S',ty:'简答',src:'15简答·21简答',
 q:'国际服务贸易的四种提供方式（GATS）',
 a:'①跨境交付：自一成员境内向另一成员境内提供服务（如跨境电信、网络服务）；\n②境外消费：在一成员境内向另一成员消费者提供服务（如外国游客、留学生）；\n③商业存在：通过在他成员境内设立商业机构提供服务（如设银行、律师事务所），是最主要方式；\n④自然人流动：以自然人身份进入他成员境内提供服务（如外国律师驻华）。'},

{id:'t18',m:0,ch:'第3章 货物与服务贸易',t:'服务外包',lv:'B',ty:'名解',src:'16论述',
 q:'服务外包',
 a:'企业将价值链中原本由自身提供的、基础性的、共性的、非核心的 IT 业务及基于 IT 的业务流程剥离出来，外包给外部专业服务商完成的经济活动。基于信息网络技术，目的是重组价值链、优化资源配置、增强核心竞争力。'},

{id:'t19',m:0,ch:'第4章 区域一体化与 WTO',t:'区域经济一体化',lv:'S',ty:'名解',src:'15名解·18论述',
 q:'区域经济一体化',
 a:'区域内或区域间的国家通过书面文件，逐步取消关税与非关税壁垒，实现货物、服务和生产要素的自由流动，进而协调产业、财政与货币政策，并建立超国家机构的过程。\n六种形式（由低到高）：优惠贸易安排→自由贸易区→关税同盟→共同市场→经济同盟→完全经济一体化。'},

{id:'t20',m:0,ch:'第4章 区域一体化与 WTO',t:'贸易创造与贸易转移',lv:'S',ty:'论述',src:'15论述·18名解',
 q:'贸易创造效应与贸易转移效应',
 a:'贸易创造：成员国间取消关税后，原先由国内高成本生产供应的商品，被成员国内低成本进口替代，贸易量扩大，资源效率改善、福利提高。\n贸易转移：对外统一关税使进口来源从低成本非成员国转向高成本成员国，资源配置恶化，福利损失。\n净福利＝贸易创造－贸易转移。'},

{id:'t21',m:0,ch:'第4章 区域一体化与 WTO',t:'WTO 基本原则',lv:'S',ty:'论述',src:'16论述',
 q:'世界贸易组织的基本原则',
 a:'①非歧视原则：最惠国待遇＋国民待遇；\n②互惠原则；\n③透明度原则；\n④关税保护与关税减让、取消数量限制原则；\n⑤公平贸易原则（反倾销、反补贴）；\n⑥对发展中国家优惠原则；\n⑦例外条款：幼稚产业保护、关税同盟与自贸区例外、保障条款。'},

{id:'t22',m:0,ch:'第4章 区域一体化与 WTO',t:'最惠国待遇',lv:'S',ty:'名解',src:'24名解',
 q:'最惠国待遇',
 a:'一成员现在或将来给予任何第三方的优惠、特权与豁免，应立即无条件地给予其他成员方。分无条件与有条件两种。作用：把双边互惠推广为多边，使贸易机会均等。'},

{id:'t23',m:0,ch:'第4章 区域一体化与 WTO',t:'GATS 主要内容',lv:'S',ty:'论述',src:'17论述',
 q:'《服务贸易总协定》（GATS）的主要内容',
 a:'①最惠国待遇（一般义务，不仅适用服务也适用提供者）；\n②国民待遇（承诺义务，重实际效果）；\n③透明度；\n④发展中国家特别待遇；\n⑤对歧视性措施的规定（支付与转移、政府采购、补贴）；\n⑥国内规定；\n⑦市场准入与逐步自由化；\n⑧争端解决。'},

{id:'t24',m:0,ch:'第4章 区域一体化与 WTO',t:'外贸发展战略',lv:'A',ty:'简答',src:'—',
 q:'进口替代战略与出口导向战略',
 a:'进口替代：以高关税、数量限制、本币高估保护本国工业，用国产品替代进口。优点：建立工业基础、扩大就业、节约外汇；缺点：受国内市场限制、效率低、出口受阻。\n出口导向：以出口带动工业化，本币贬值、鼓励出口。优点：获得规模经济、增加就业与外汇；缺点：易受外部冲击传导。'},

/* ========== 二、国际直接投资 ========== */
{id:'i01',m:1,ch:'第1章 FDI 与跨国公司理论',t:'垄断优势论',lv:'S',ty:'论述',src:'16名解·17论述',
 q:'海默的垄断优势理论',
 a:'①核心：市场不完全是对外直接投资的根本原因，企业垄断优势是获利的条件。若市场完全有效，FDI 不可能发生。\n②市场不完全的四个方面：产品市场、要素市场、规模经济、政府政策。\n③垄断优势：技术、管理经验、资金、信息、规模经济、全球销售网络。\n评价：开创了以 FDI 为对象的独立研究领域；但以美国为样本，无法解释发展中国家对外投资，且偏静态、忽视区位因素。'},

{id:'i02',m:1,ch:'第1章 FDI 与跨国公司理论',t:'国际生产折衷理论 OLI',lv:'S',ty:'论述',src:'24名解·23论述',
 q:'邓宁的国际生产折衷理论（OLI）',
 a:'①所有权优势 O：企业拥有而他国企业没有或难以获得的优势（技术、管理、规模、资金），是投资的必要条件；\n②内部化优势 I：通过内部交易避免市场不完全带来的成本，也是必要条件；\n③区位优势 L：东道国不可移动的要素禀赋与政策环境，决定投资的地理方向，是充分条件。\n组合：只有 O → 技术许可；O＋I → 出口；O＋I＋L → 对外直接投资。\n评价：集大成，提供综合分析框架；但创新不足。'},

{id:'i03',m:1,ch:'第1章 FDI 与跨国公司理论',t:'小岛清边际产业扩张论',lv:'S',ty:'简答',src:'18简答',
 q:'小岛清边际产业扩张论',
 a:'①对外直接投资应从本国已处于或即将处于比较劣势的产业（边际产业）依次进行；\n②这些边际产业恰是东道国具有或潜在具有比较优势的产业；\n③两国在投资与引致贸易中互补获益。\n三点突破：摒弃市场不完全论点、摒弃垄断优势论点、主张贸易创造型而非贸易替代型。'},

{id:'i04',m:1,ch:'第1章 FDI 与跨国公司理论',t:'投资周期论',lv:'A',ty:'名解',src:'—',
 q:'邓宁的投资周期论',
 a:'国际生产折衷理论的动态化。一国国际投资地位与经济发展水平相关，人均 GNP 越高，对外投资净额越大。四阶段：①无 O、L、I，资本净流入；②L 增强；③O 增强；④三者齐备，资本净输出。'},

{id:'i05',m:1,ch:'第1章 FDI 与跨国公司理论',t:'内部化理论',lv:'B',ty:'名解',src:'—',
 q:'内部化理论',
 a:'巴克利与卡森提出。市场不完全使中间产品（技术、知识、管理技能）外部交易成本高且难以定价，企业通过对外投资将交易内部化，以降低交易成本、保护垄断优势。'},

{id:'i06',m:1,ch:'第2章 FDI 类型与决策',t:'水平型 / 垂直型 FDI',lv:'S',ty:'简答',src:'14简答·16名解·25简答',
 q:'水平型与垂直型对外直接投资的动机差异',
 a:'水平型（横向型）：在海外建立与国内生产经营方向一致的子公司，独立完成全部生产销售。动机：绕开贸易壁垒、占领当地市场、降低运输成本。\n垂直型（纵向型）：按生产阶段专业化分工，在海外设立与国内生产有关联的子公司。动机：利用各国要素成本差异、获取资源、提高专业化效率。'},

{id:'i07',m:1,ch:'第2章 FDI 类型与决策',t:'国际直接投资',lv:'S',ty:'名解',src:'17名解·23名解',
 q:'国际直接投资',
 a:'投资者在国外创办企业或与当地资本合营企业，涉及资本货物、管理技术等生产要素的直接投入，投资者对所投要素的使用和生产过程拥有直接控制权。核心特征是控制权与经营管理权。形式：创办新企业、购股达到控制比例、利润再投资。'},

{id:'i08',m:1,ch:'第2章 FDI 类型与决策',t:'绿地投资',lv:'S',ty:'论述',src:'16论述',
 q:'绿地投资及其优缺点',
 a:'在东道国兴建全新企业，形成新的生产能力。\n优点：①可按全球战略选择规模与区位；②对子公司有完全控制权；③技术、工艺不外溢。\n缺点：①筹建量大、周期长、资金要求高；②面临较高政治与社会风险；③需自行开拓市场，管理人才短缺。'},

{id:'i09',m:1,ch:'第2章 FDI 类型与决策',t:'跨国并购',lv:'S',ty:'论述',src:'15名解·18论述',
 q:'跨国并购及其优缺点',
 a:'一国企业通过一定渠道与支付手段，购买另一国企业全部或足以行使控制权的股份，从而实施实际或完全控制。\n优点：①快速进入，获得现成的生产设施、渠道与品牌；②获取技术与管理经验；③绕过壁垒、缩短周期。\n缺点：①估值与溢价风险；②整合困难、文化冲突；③东道国审查与政治阻力。'},

{id:'i10',m:1,ch:'第2章 FDI 类型与决策',t:'国际合资企业',lv:'S',ty:'论述',src:'15论述·17论述',
 q:'国际合资企业的特点',
 a:'①双方共同出资、共同经营、共担风险、共享利润；\n②按股权比例分配控制权与收益；\n③可借助当地伙伴的市场渠道、政府关系与本土经验；\n④易产生控制权、技术转让与利润分配方面的冲突。'},

{id:'i11',m:1,ch:'第2章 FDI 类型与决策',t:'独资 / 合作企业',lv:'A',ty:'名解',src:'14名解·18名解',
 q:'国际独资企业 / 国际合作企业',
 a:'国际独资企业：投资者在东道国单独出资设立、独立经营、自负盈亏的企业，全部股权归投资者所有，控制权完整但风险自担。\n国际合作企业：双方以契约方式约定投资条件、收益分配与风险承担，不按股权比例，属契约式合营。'},

{id:'i12',m:1,ch:'第3章 跨国公司',t:'跨国经营指数',lv:'A',ty:'名解',src:'18名解·23名解',
 q:'跨国经营指数（TNI）',
 a:'衡量企业跨国程度的综合指标，为三项比率的算术平均：\nTNI＝(国外资产/总资产＋国外销售额/总销售额＋国外雇员数/雇员总数)/3×100%。\n数值越高，说明企业跨国经营程度越深。'},

{id:'i13',m:1,ch:'第3章 跨国公司',t:'跨国公司特点',lv:'S',ty:'简答',src:'21·22·23',
 q:'跨国公司的经营特点',
 a:'①以实力雄厚的大公司为主体，通过 FDI 或收购在多国设立子公司；\n②有完整决策体系与最高决策中心，子公司服从全局；\n③从全球战略出发安排经营活动，全球寻市场、定点生产、定点销售；\n④资金与技术实力强，信息传递快，可快速跨国转移资金；\n⑤在特定产品或地区具有不同程度的垄断性。'},

{id:'i14',m:1,ch:'第3章 跨国公司',t:'母公司法律特征',lv:'S',ty:'简答',src:'19名解',
 q:'跨国公司母公司的法律特征',
 a:'①是依母国法律设立的独立法人；\n②拥有子公司的股权，能实际控制子公司的经营决策；\n③对子公司的债务原则上以出资额为限承担责任；\n④统一制定全球战略并分配资源；\n⑤在法律上母子公司各自独立，但经济上是一个整体。'},

{id:'i15',m:1,ch:'第3章 跨国公司',t:'对外投资保险制度',lv:'A',ty:'名解',src:'15名解',
 q:'对外投资保险制度',
 a:'资本输出国政府对本国投资者在海外可能遭遇的政治风险（征收、战争、汇兑限制）提供保险的制度，由国家专门机构承保，属于政策性保险，旨在鼓励对外投资。'},

{id:'i16',m:1,ch:'第3章 跨国公司',t:'转移价格',lv:'B',ty:'论述',src:'—',
 q:'国际转移价格及其动因',
 a:'跨国公司内部母子公司、子公司之间购销商品、提供劳务、转让无形资产时使用的内部价格，不受市场供求影响。\n动因：①避税（转移至低税率国家）；②规避政治风险；③规避外汇风险与外汇管制；④争夺与控制市场。'},

{id:'i17',m:1,ch:'第4章 母国与东道国效应',t:'中国对外投资的母国产业结构效应',lv:'S',ty:'论述',src:'14论述',
 q:'中国对外直接投资对母国的产业结构效应',
 a:'①资源补缺效应：获取国内短缺的能源与原材料，缓解瓶颈；\n②产业转移效应：把成熟或边际产业转移出去，为国内产业升级腾出空间；\n③技术反向溢出：通过并购获取先进技术、品牌与管理经验，反哺国内；\n④出口带动效应：带动设备、零部件出口；\n⑤风险：短期资本外流、产业空心化、就业转移。'},

/* ========== 三、国际金融 ========== */
{id:'f01',m:2,ch:'第1章 国际收支',t:'国际收支',lv:'B',ty:'名解',src:'—',
 q:'国际收支',
 a:'一国居民与非居民在一定时期内全部经济交易的系统记录，是流量概念。平衡表含经常账户、资本与金融账户、错误与遗漏账户。'},

{id:'f02',m:2,ch:'第1章 国际收支',t:'马歇尔-勒纳条件与 J 曲线',lv:'S',ty:'名解',src:'15名解',
 q:'马歇尔-勒纳条件与 J 曲线效应',
 a:'马歇尔-勒纳条件：在进出口供给弹性无穷大的前提下，只有出口需求弹性与进口需求弹性之和的绝对值大于 1，本币贬值才能改善贸易收支。\nJ 曲线：贬值后贸易收支先恶化、后改善，因存在认识、决策、生产与交货时滞，短期内弹性之和小于 1，中长期大于 1。'},

{id:'f03',m:2,ch:'第2章 国际储备',t:'国际储备',lv:'B',ty:'名解',src:'18简答',
 q:'国际储备及其适度性',
 a:'一国货币当局持有的、用于对外支付、平衡国际收支和维持汇率稳定的资产。构成：黄金储备、外汇储备、在 IMF 的储备头寸、SDR。\n适度性衡量：①进口比例法（储备/年进口额）；②债务比例法；③机会成本—收益法。'},

{id:'f04',m:2,ch:'第3章 汇率制度',t:'布雷顿森林体系',lv:'S',ty:'简答',src:'15简答',
 q:'布雷顿森林体系的主要内容及缺陷',
 a:'内容：①双挂钩：美元与黄金挂钩，各国货币与美元挂钩；②可调整的固定汇率制；③IMF 提供辅助储备；④取消经常项目外汇管制；⑤稀缺货币条款。\n缺陷：①特里芬难题——美元供给与信心的内在矛盾；②固定汇率难以调节国际收支失衡；③美国可输出通胀。'},

{id:'f05',m:2,ch:'第3章 汇率制度',t:'特里芬难题',lv:'B',ty:'名解',src:'—',
 q:'特里芬难题',

/* ---------- 2. 模块与常量 ---------- */
const MODS = ['国际贸易理论与政策','国际直接投资与跨国公司','国际金融','国际商务环境与运营'];
const LVW  = {S:3, A:2, B:1.5, C:1};
const INT  = [0, 1, 2, 4, 7, 15, 30];   // 掌握度 0-6 对应的复习间隔（天）
const DAY  = 86400000;
const KEY  = 'imx434_v1';
const EXAM = new Date('2026-12-19T00:00:00');

/* ---------- 3. 状态存取 ---------- */
let S = null;

function blank(){
  return {v:1, kp:{}, wrong:[], log:[], days:{}, created:Date.now()};
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return blank();
    const o = JSON.parse(raw);
    if(!o || o.v!==1) return blank();
    o.kp = o.kp || {}; o.wrong = o.wrong || []; o.log = o.log || []; o.days = o.days || {};
    return o;
  }catch(e){ return blank(); }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ console.warn('存储失败', e); }
}
function kps(id){
  if(!S.kp[id]){
    S.kp[id] = {m:0, ok:0, err:0, seen:0, last:0, due:0, star:false};
  }
  return S.kp[id];
}

/* ---------- 4. 权重引擎 ---------- */
/* 权重 = 优先级 × 薄弱系数 × 遗忘系数 × 逾期系数 */
function weight(k){
  const s = kps(k.id);
  const rate = s.seen ? s.err / s.seen : 0.5;
  const mast = s.m / 6;
  const over = (s.due && s.due <= Date.now()) ? 1.6 : 1;
  return (LVW[k.lv] || 1) * (1 + 2*rate) * (1 + 1.5*(1-mast)) * over;
}

/* 到期判断 */
function isDue(k){
  const s = kps(k.id);
  return !s.due || s.due <= Date.now();
}

/* 排序：权重降序 */
function ranked(list){
  return list.slice().sort((a,b)=> weight(b) - weight(a));
}

/* ---------- 5. 答题记录（全站唯一入口） ---------- */
function answer(id, correct){
  const s = kps(id);
  s.seen++; s.last = Date.now();

  if(correct){
    s.ok++;
    s.m = Math.min(6, s.m + 1);
    if(s.ok >= 2) S.wrong = S.wrong.filter(x=>x!==id);   // 连对2次出库
  }else{
    s.err++; s.ok = 0;
    s.m = Math.max(0, s.m - 1);
    if(!S.wrong.includes(id)) S.wrong.unshift(id);
  }

  s.due = Date.now() + INT[s.m] * DAY;

  // 日志 + 打卡
  S.log.push({t:Date.now(), id, ok:correct?1:0});
  if(S.log.length > 3000) S.log = S.log.slice(-2000);
  const d = new Date(); const key = d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
  S.days[key] = (S.days[key]||0) + 1;

  save();
  Bus.emit('answer', {id, correct});
  return s;
}

/* 标熟 */
function markMastered(id){
  const s = kps(id);
  s.m = 6; s.star = true; s.ok = Math.max(s.ok, 2);
  s.due = Date.now() + 30*DAY;
  S.wrong = S.wrong.filter(x=>x!==id);
  save();
  Bus.emit('mastered', {id});
}

/* 取消标熟 */
function unmark(id){
  const s = kps(id);
  s.m = 0; s.star = false; s.due = 0;
  save();
  Bus.emit('mastered', {id});
}

/* ---------- 6. 统计 ---------- */
function stats(){
  const total = DATA.length;
  let mastered=0, learning=0, weak=0, untouched=0;
  const byMod = [0,1,2,3].map(()=>({total:0, mastered:0}));
  const byLv  = {S:{t:0,m:0}, A:{t:0,m:0}, B:{t:0,m:0}, C:{t:0,m:0}};

  DATA.forEach(k=>{
    const s = kps(k.id);
    byMod[k.m].total++;
    byLv[k.lv].t++;
    if(s.m >= 5 || s.star){ mastered++; byMod[k.m].mastered++; byLv[k.lv].m++; }
    else if(s.seen > 0) learning++;
    else untouched++;
    if(s.err > 0) weak++;
  });

  const seen = DATA.filter(k=>kps(k.id).seen>0).length;
  const right = S.log.filter(x=>x.ok).length;
  const acc = S.log.length ? Math.round(right / S.log.length * 100) : 0;

  return {total, mastered, learning, weak, untouched, seen, acc, byMod, byLv,
          attempts:S.log.length};
}

/* ---------- 7. 事件总线 ---------- */
const Bus = {
  h: {},
  on(evt, fn){ (this.h[evt] = this.h[evt] || []).push(fn); },
  emit(evt, data){ (this.h[evt]||[]).forEach(fn=>{ try{ fn(data); }catch(e){ console.error(e); } }); }
};

/* ---------- 8. 插件接口（不修改旧代码即可扩展） ----------
   用法：在文件末尾另起一个 <script>，写
   MOUNT_PLUGIN({
     id:'hot',
     title:'热点专题',
     tab:true,                 // 是否在顶部加一个标签页
     mount(root){ ... },       // 渲染到 root
     onAnswer(d){ ... }        // 监听答题事件
   });
----------------------------------------------------- */
const Registry = {
  mods: [],
  register(m){
    if(!m || !m.id) return;
    if(this.mods.some(x=>x.id===m.id)) return;
    this.mods.push(m);
    Bus.on('answer', d => m.onAnswer && m.onAnswer(d));
    Bus.on('mastered', d => m.onMastered && m.onMastered(d));
    if(typeof window.__afterRegister === 'function') window.__afterRegister(m);
  }
};
window.MOUNT_PLUGIN = m => Registry.register(m);
window.Registry = Registry;
window.Store = {
  get state(){ return S; },
  data: DATA, mods: MODS, weight, isDue, ranked, answer, markMastered, unmark, stats, save,
  byId: id => DATA.find(k=>k.id===id)
};

/* ---------- 9. 初始化状态 ---------- */
S = load();
if(!S.created) S.created = Date.now();
save();
</script>

function renderModProg(st){
  $('#modprog').innerHTML = [0,1,2,3].map(i=>{
    const o = st.byMod[i];
    const p = o.total ? Math.round(o.mastered / o.total * 100) : 0;
    return `<div class="prow">
      <div class="pt"><span>${CN[i]}</span><span>${o.mastered}/${o.total}</span></div>
      <div class="pb"><i style="width:${p}%"></i></div>

/* ---------- 标签页 ---------- */
function renderTabs(){
  const base = [
    ['today','今日台'],['outline','提纲'],['card','闪卡'],['wrong','错题本'],['stat','数据']
  ];
  const plugs = Registry.mods.filter(m=>m.tab).map(m=>['plugin:'+m.id, m.title]);
  const all = base.concat(plugs);
  $('#tabs').innerHTML = all.map(([k,t])=>
    `<button data-tab="${k}" class="${UI.tab===k?'on':''}">${t}</button>`
  ).join('');
  $('#tabs').querySelectorAll('button').forEach(b=>{
    b.onclick = ()=> route(b.dataset.tab);
  });
}

/* ---------- 路由 ---------- */
function route(tab, arg){
  UI.tab = tab;
  if(arg !== undefined) UI.cur = arg;
  renderTabs();
  const v = $('#view');
  if(tab.startsWith('plugin:')){
    const m = Registry.mods.find(x=>'plugin:'+x.id === tab);
    v.innerHTML = '';
    if(m && m.mount) m.mount(v);
    else v.innerHTML = '<p class="muted">插件未加载</p>';
    return;
  }
  if(tab === 'today')    renderToday(v);
  if(tab === 'outline')  renderOutline(v);
  if(tab === 'card')     renderCard(v);
  if(tab === 'wrong')    renderWrong(v);
  if(tab === 'stat')     renderStat(v);
  updateHeader();
}

/* ==================================================================
   树
   ================================================================== */
function renderTree(){
  const q = UI.q.trim().toLowerCase();
  let list = DATA;
  if(q){
    list = DATA.filter(k =>
      k.t.toLowerCase().includes(q) ||
      k.a.toLowerCase().includes(q) ||
      k.ch.toLowerCase().includes(q)
    );
  }
  const groups = [0,1,2,3].map(m=>({m, chs:{}}));
  list.forEach(k=>{
    const g = groups[k.m];
    (g.chs[k.ch] = g.chs[k.ch] || []).push(k);
  });

  $('#tree').innerHTML = groups.map(g=>{
    const all = DATA.filter(k=>k.m===g.m);
    if(!all.length) return '';
    const chKeys = Object.keys(g.chs);
    if(q && !chKeys.length) return '';
    const done = all.filter(k=>kps(k.id).m>=5).length;
    return `<div class="tnode">
      <div class="tmod open" data-m="${g.m}">
        <span>${CN[g.m]} · ${MODS[g.m].slice(4) || MODS[g.m]}</span>
        <span class="cnt">${done}/${all.length}</span>
      </div>
      <div class="tchs">
        ${chKeys.map(ch=>{
          const arr = g.chs[ch];
          const d2 = arr.filter(k=>kps(k.id).m>=5).length;
          return `<div class="tch" data-ch="${esc(ch)}">
            <span>${esc(ch)}</span><span class="cnt">${d2}/${arr.length}</span>
          </div>
          ${arr.map(k=>`<a class="tkp ${UI.cur===k.id?'on':''}" data-id="${k.id}">
              <em class="lv ${k.lv.toLowerCase()}" style="font-size:9px">${k.lv}</em>${esc(k.t)}
            </a>`).join('')}`;
        }).join('')}
      </div>
    </div>`;
  }).join('');

  // 折叠
  $('#tree').querySelectorAll('.tmod').forEach(el=>{
    el.onclick = e=>{ el.classList.toggle('open'); };
  });
  // 点知识点
  $('#tree').querySelectorAll('.tkp').forEach(el=>{
    el.onclick = ()=>{ route('outline', el.dataset.id); };
  });
}

/* ==================================================================
   今日台
   ================================================================== */
function todayTasks(){
  const unseen = ranked(DATA.filter(k=>kps(k.id).seen===0)).slice(0,3);
  const due    = ranked(DATA.filter(k=>kps(k.id).seen>0 && isDue(k))).slice(0,2);
  const weak   = ranked(DATA.filter(k=>kps(k.id).err>0)).slice(0,2);
  const seen = new Set(); const out = [];
  const push = (k, why)=>{
    if(!k || seen.has(k.id)) return;
    seen.add(k.id); out.push({k, why});
  };
  weak.forEach(k=> push(k, '薄弱点 · 错误 ' + kps(k.id).err + ' 次'));
  due.forEach(k=> push(k, '到期复习'));
  unseen.forEach(k=> push(k, '新考点'));
  return out.slice(0,6);
}

function renderToday(v){
  const st = stats();
  const tasks = todayTasks();
  const d = Math.ceil((EXAM - Date.now()) / DAY);

  v.innerHTML = `
    <h1 class="h1">今日台</h1>
    <p class="muted">距初试 ${d} 天 · 今天按权重给你排了 ${tasks.length} 项</p>

      <div class="task">

function renderOutline(v){

function markM(id){ markMastered(id); route('outline', id); }
function unmarkM(id){ unmark(id); route('outline', id); }

/* ==================================================================
   闪卡
   ================================================================== */
function buildQueue(seedId){
  const pool = DATA.filter(k=>kps(k.id).err>0 || isDue(k));
  let ids = ranked(pool.length ? pool : DATA).map(k=>k.id);
  if(seedId){
    ids = [seedId].concat(ids.filter(x=>x!==seedId));
  }
  UI.queue = ids;
  UI.qi = 0;
  UI.flipped = false;
}

function startCard(id){
  buildQueue(id);
  route('card');
}

function renderCard(v){
  if(!UI.queue.length) buildQueue();
  if(UI.qi >= UI.queue.length){ UI.qi = 0; UI.flipped = false; }

  const id = UI.queue[UI.qi];
  const k = DATA.find(x=>x.id===id);
  if(!k){ v.innerHTML='<p class="muted">没有可复习的卡片</p>'; return; }
  const s = kps(k.id);

  v.innerHTML = `
    <div class="fcWrap">
      <div style="display:flex;justify-content:space-between;width:100%;max-width:700px;margin-bottom:10px">
        <span class="muted">第 ${UI.qi+1} / ${UI.queue.length} 张</span>
        <span class="muted">掌握度 ${s.m}/6　错 ${s.err} 次</span>
      </div>

      <div class="fc" id="fc">
        <div class="fctop">${lvBadge(k.lv)}<span class="ty">${k.ty}</span>
          <span class="src">${CN[k.m]} · ${esc(k.ch)}</span></div>
        <div class="q">${esc(k.q)}</div>
        <div class="a ${UI.flipped?'show':''}" id="ans">${UI.flipped?esc(k.a):'（点击卡片或按空格查看答案）'}</div>
        <div class="hint">${UI.flipped?'按 1 忘了 · 2 模糊 · 3 记得':'空格翻面'}</div>
      </div>

      <div class="fcFoot">
        <button class="no"  onclick="gradeCard('no')">忘了 1</button>
        <button class="mid" onclick="gradeCard('mid')">模糊 2</button>
        <button class="yes" onclick="gradeCard('yes')">记得 3</button>
      </div>
    </div>`;

  $('#fc').onclick = flip;
}

function flip(){
  UI.flipped = !UI.flipped;
  const a = $('#ans');
  if(!a) return;
  const k = DATA.find(x=>x.id===UI.queue[UI.qi]);
  if(UI.flipped){ a.textContent = k.a; a.classList.add('show'); }
  else { a.textContent = '（点击卡片或按空格查看答案）'; a.classList.remove('show'); }
}

function gradeCard(level){
  const id = UI.queue[UI.qi];
  if(level === 'yes'){
    answer(id, true);
  }else if(level === 'no'){
    answer(id, false);
  }else{
    const s = kps(id);
    s.seen++; s.last = Date.now(); s.ok = 0;
    s.due = Date.now() + 1*DAY;
    S.log.push({t:Date.now(), id, ok:0});
    save();
    Bus.emit('answer', {id, correct:false, mid:true});
  }
  UI.qi++;
  UI.flipped = false;
  if(UI.qi >= UI.queue.length) buildQueue();
  renderCard($('#view'));
  updateHeader();
}

/* ==================================================================

   ================================================================== */
function streak(){
  let n = 0; const d = new Date();
  for(let i=0;i<400;i++){
    const key = d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
    if(S.days[key]) n++;
    else if(i>0) break;
    d.setDate(d.getDate()-1);
  }
  return n;
}

  const st = stats();

  const r = new FileReader();
  r.onload = ()=>{
    try{
      const o = JSON.parse(r.result);
      if(!o || !o.kp) throw new Error('格式不对');
      S = Object.assign(blank(), o);
      save(); route(UI.tab); updateHeader();
      alert('导入成功');
    }catch(err){ alert('导入失败：' + err.message); }
  };
  r.readAsText(f);
};

$('#search').oninput = e=>{ UI.q = e.target.value; renderTree(); };

document.addEventListener('keydown', e=>{
  if(e.target.tagName === 'INPUT') {
    if(e.key === 'Escape') e.target.blur();
    return;
  }
  if(e.key === '/'){
    e.preventDefault(); $('#search').focus(); return;
  }
  if(UI.tab !== 'card') return;
  if(e.code === 'Space' || e.key === 'Enter'){
    e.preventDefault(); flip(); return;
  }
  if(e.key === '1') gradeCard('no');
  if(e.key === '2') gradeCard('mid');
  if(e.key === '3') gradeCard('yes');
});

/* ---------------- 排序题 ---------------- */
(function(){
  const SEQS = [
    {id:'t19', title:'区域经济一体化的六种形式（由低到高）',
     items:['优惠贸易安排','自由贸易区','关税同盟','共同市场','经济同盟','完全经济一体化']},
    {id:'t05', title:'产品生命周期的三个阶段',
     items:['创新阶段','成熟阶段','标准化阶段']},
    {id:'f17', title:'人民币汇率制度的演进顺序',
     items:['双重汇率并存（1981—1993）','汇率并轨（1994）','参考一篮子货币（2005）','完善中间价机制（2015 以来）']},
    {id:'o01', title:'选择国际目标市场的步骤',
     items:['市场细分','评估细分市场','筛选目标市场','确定目标市场策略','市场定位']},
    {id:'t17', title:'GATS 服务贸易四种方式',
     items:['跨境交付','境外消费','商业存在','自然人流动']},
    {id:'i04', title:'邓宁投资周期论的四个阶段',
     items:['无三种优势，资本净流入','区位优势增强','所有权优势增强','三种优势齐备，资本净输出']},
    {id:'i01', title:'海默垄断优势论的论证顺序',
     items:['市场不完全','企业垄断优势','对外直接投资','获取超额利润']},
    {id:'f06', title:'比较固定与浮动汇率制的维度',
     items:['汇率稳定性','货币政策独立性','通货膨胀传导','国际收支调节','外汇风险']},
    {id:'t15', title:'外汇倾销生效的三个条件',
     items:['贬值幅度大于国内物价上涨','出口需求弹性较大','他国不同时等幅贬值']},
    {id:'f04', title:'布雷顿森林体系的“双挂钩”',
     items:['美元与黄金挂钩','各国货币与美元挂钩']}
  ];

  const D = {cur:null, seq:[], placed:[], err:0};

  function start(){
    const q = SEQS[Math.floor(Math.random()*SEQS.length)];
    D.cur = q;
    D.placed = [];
    D.err = 0;
    D.seq = q.items
      .map((t,i)=>({t, i}))
      .sort(()=>Math.random()-.5);
  }

  function render(root){
    if(!D.cur) start();
    const q = D.cur;
    const left = D.seq.filter(x=>!D.placed.includes(x.i));

    root.innerHTML = `
      <h1 class="h1">排序题</h1>
      <p class="muted">按正确顺序依次点击 · 目前错误 ${D.err} 次</p>

      <div class="panel" style="margin-top:16px">
        <h3>${q.title}</h3>
        <div id="slots" style="display:flex;flex-wrap:wrap;gap:8px;min-height:44px;padding:6px 0">
          ${D.placed.map((i,idx)=>`
            <span style="background:#f2fbf5;border:1px solid #bde5c8;color:#166534;
              padding:7px 12px;border-radius:9px;font-size:14px">
              ${idx+1}. ${q.items[i]}</span>`).join('')}
        </div>
      </div>

      <div id="pool" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px">
        ${left.map(x=>`
          <span data-i="${x.i}" style="cursor:pointer;background:#fff;border:1px solid var(--line);
            padding:9px 14px;border-radius:10px;font-size:14px;box-shadow:var(--sh)">
            ${x.t}</span>`).join('')}
      </div>

      <div id="sfoot" style="margin-top:16px"></div>`;

    root.querySelectorAll('#pool span').forEach(el=>{
      el.onclick = ()=> tap(root, +el.dataset.i);
    });
  }

  function tap(root, i){
    const q = D.cur;
    const expect = D.placed.length;
    if(i === expect){
      D.placed.push(i);
      render(root);
      if(D.placed.length === q.items.length) finish(root);
    }else{
      D.err++;
      const el = root.querySelector(`#pool span[data-i="${i}"]`);
      if(el){
        el.style.borderColor = 'var(--bad)';
        el.style.background = '#fff6f6';
        setTimeout(()=>{ el.style.borderColor='var(--line)'; el.style.background='#fff'; }, 500);
      }
      const f = root.querySelector('#sfoot');
      if(f) f.innerHTML = '<span style="color:var(--bad);font-size:13px">顺序不对，想想第一个应该是什么</span>';
    }
  }

  function finish(root){
    const q = D.cur;
    Store.answer(q.id, D.err === 0);
    root.querySelector('#sfoot').innerHTML = `
      <div class="panel">
        <b style="color:${D.err===0?'var(--ok)':'var(--warn)'}">
          ${D.err===0?'✓ 一次全对':'完成，错误 '+D.err+' 次'}</b>
        <div style="margin-top:8px;font-size:14px;line-height:1.9">
          ${q.items.map((t,i)=>`${i+1}. ${t}`).join('<br>')}
        </div>
      </div>
      <button class="btn pri" id="snext">下一题</button>`;
    root.querySelector('#snext').onclick = ()=>{ D.cur = null; start(); render(root); };
  }

  MOUNT_PLUGIN({ id:'sort', title:'排序题', tab:true, mount(root){ start(); render(root); } });
})();
</script>
<script>
/* ==================================================================
   M3  记忆计划（艾宾浩斯）＋ 一页纸导出
   ================================================================== */
(function(){

  /* ---------- 艾宾浩斯节点 ----------
     经典遗忘曲线：20分钟→58%，1小时→44%，9小时→36%，
     1天→33%，2天→28%，6天→25%，31天→21%
     本程序的复习间隔 [0,1,2,4,7,15,30] 天即按此设计
  ------------------------------------- */
  const CURVE = [
    {t:'0',   r:100}, {t:'20min', r:58}, {t:'1h', r:44}, {t:'9h', r:36},
    {t:'1天', r:33},  {t:'2天',  r:28}, {t:'6天', r:25}, {t:'31天', r:21}
  ];
  const XS = [0, 40, 80, 120, 160, 200, 240, 280];

  /* ---------- 分桶 ---------- */
  function buckets(){
    const now = Date.now();
    const end = new Date(); end.setHours(23,59,59,999);
    const out = {over:[], due:[], fresh:[], weak:[]};

    DATA.forEach(k=>{
      const s = kps(k.id);
      if(s.seen === 0){ out.fresh.push(k); return; }
      if(s.err > 0) out.weak.push(k);
      if(s.due && s.due < now) out.over.push(k);
      else if(s.due && s.due <= end) out.due.push(k);
    });

    out.over = ranked(out.over);
    out.due  = ranked(out.due);
    out.weak = ranked(out.weak);
    out.fresh = out.fresh.slice().sort((a,b)=>{
      const rank = {S:3,A:2,B:1.5,C:1};
      return (rank[b.lv]||1) - (rank[a.lv]||1);
    });
    return out;
  }

  /* ---------- 生成今日计划 ---------- */
  function buildPlan(){
    const b = buckets();
    const plan = [];
    const used = new Set();
    const add = (k, mode, why, min, act)=>{
      if(!k || used.has(k.id + mode)) return;
      used.add(k.id + mode);
      plan.push({k, mode, why, min, act});
    };

    /* 1. 逾期最先做（艾宾浩斯：逾期越久遗忘越多） */
    b.over.slice(0,4).forEach((k,i)=>{
      const d = Math.floor((Date.now() - kps(k.id).due) / DAY);
      add(k, '闪卡', '逾期 ' + (d>0?d:0) + ' 天，先抢救', 2, `startCard('${k.id}')`);
    });

    /* 2. 今日到期 */
    b.due.slice(0,4).forEach(k=>{
      add(k, '闪卡', '今天到期，按节点复习', 2, `startCard('${k.id}')`);
    });

    /* 3. 新学：S 级优先 */
    b.fresh.slice(0,3).forEach(k=>{
      add(k, '闪卡', '新考点 · ' + k.lv + ' 级', 3, `startCard('${k.id}')`);
    });

    /* 4. 换形式：打破单一刺激，交替记忆更牢 */
    plan.push({k:null, mode:'概念对抗', why:'换个形式激活再认，专治混淆',
               min:4, act:`route('duel')`});
    plan.push({k:null, mode:'排序题', why:'结构化记忆，适合历程类考点',
               min:3, act:`route('sort')`});
    plan.push({k:null, mode:'论述骨架', why:'口述一遍＝主动回忆＋组织加工',
               min:8, act:`route('skel')`});

    /* 5. 薄弱点收尾 */
    b.weak.slice(0,2).forEach(k=>{
      add(k, '提纲默写', '错过的点，合上书自己复述', 3, `route('outline','${k.id}')`);
    });

    return {plan, b};
  }

  /* ---------- 曲线图 ---------- */
  function svgCurve(){
    const W = 320, H = 130, P = 18;
    const pts = CURVE.map((c,i)=>{
      const x = P + XS[i] / 280 * (W - P*2);
      const y = H - P - (c.r / 100) * (H - P*2);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');

    const dots = CURVE.map((c,i)=>{
      const x = P + XS[i] / 280 * (W - P*2);
      const y = H - P - (c.r / 100) * (H - P*2);
      return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="#3665f3"/>
              <text x="${x.toFixed(1)}" y="${(y-7).toFixed(1)}" font-size="8"
                    fill="#727b8f" text-anchor="middle">${c.r}</text>`;
    }).join('');

    const labels = ['0','20min','1h','9h','1天','2天','6天','31天']
      .map((t,i)=>{
        const x = P + XS[i] / 280 * (W - P*2);
        return `<text x="${x.toFixed(1)}" y="${H-4}" font-size="8"
                 fill="#727b8f" text-anchor="middle">${t}</text>`;
      }).join('');

    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
      <line x1="${P}" y1="${H-P}" x2="${W-P}" y2="${H-P}" stroke="#e5e8f0"/>
      <line x1="${P}" y1="${P}" x2="${P}" y2="${H-P}" stroke="#e5e8f0"/>
      <polyline points="${pts}" fill="none" stroke="#3665f3" stroke-width="2"/>
      ${dots}${labels}
    </svg>`;
  }

  /* ---------- 渲染 ---------- */
  function render(root){
    const {plan, b} = buildPlan();
    const totalMin = plan.reduce((a,p)=>a+p.min, 0);

    root.innerHTML = `
      <h1 class="h1">记忆计划</h1>
      <p class="muted">按艾宾浩斯节点自动排的今日清单 · 预计 ${totalMin} 分钟</p>

      <div class="kpis" style="margin:16px 0">
        <div class="kpi"><b>${b.over.length}</b><span>逾期</span></div>
        <div class="kpi"><b>${b.due.length}</b><span>今日到期</span></div>
        <div class="kpi"><b>${b.fresh.length}</b><span>未接触</span></div>
        <div class="kpi"><b>${b.weak.length}</b><span>薄弱</span></div>
      </div>

      <div class="h2">今日任务（按顺序做）</div>
      ${plan.map((p,i)=>`
        <div class="task">
          <div class="idx">${i+1}</div>
          <div class="tx">
            <b>${p.k ? lvBadge(p.k.lv)+' '+esc(p.k.t) : '【'+p.mode+'】'}</b>
            <span>${p.mode} · ${p.min} 分钟${p.k ? ' · '+CN[p.k.m] : ''}</span>
            <div class="why">${p.why}</div>
          </div>
          <button class="btn pri sm" onclick="${p.act}">开始</button>
        </div>`).join('')}

      <div class="h2">遗忘曲线与复习节点</div>
      <div class="panel">
        ${svgCurve()}
        <p class="muted" style="margin:6px 0 0;font-size:12px">
          不复习时，1 天后只剩约 33%。每次在遗忘临界点复习，曲线会被重新拉回高点，
          所以本程序的间隔是 0→1→2→4→7→15→30 天。
        </p>
      </div>

      <div class="h2">当前复习节奏</div>
      <div class="panel">
        <table style="width:100%;font-size:13px;border-collapse:collapse">
          <tr style="color:#727b8f;text-align:left">
            <th style="padding:6px 0">掌握度</th><th>下次复习</th><th>含义</th>
          </tr>
          ${[0,1,2,3,4,5,6].map(m=>`
            <tr style="border-top:1px solid #eef1f7">
              <td style="padding:7px 0">${m}</td>
              <td>${m===0?'马上':INT[m]+' 天后'}</td>
              <td class="muted">${
                m<=1?'刚学 / 常错':m<=3?'初步记住':'稳固'
              }</td>
            </tr>`).join('')}
        </table>
      </div>

      <div class="btns">
        <button class="btn pri" onclick="exportOnePage()">导出一页纸（打印）</button>
      </div>`;
  }

  /* ---------- 一页纸 ---------- */
  window.exportOnePage = function(){
    const list = DATA.filter(k=>{
      const s = kps(k.id);
      return k.lv === 'S' || s.err > 0;
    });
    const byMod = [0,1,2,3].map(m=>list.filter(k=>k.m===m)).filter(a=>a.length);

    const html = `
      <html><head><meta charset="utf-8"><title>434 一页纸</title>
      <style>
        body{font:12px/1.7 "Microsoft YaHei",sans-serif;color:#111;padding:18px 22px}
        h1{font-size:17px;margin:0 0 4px}
        h2{font-size:13px;margin:14px 0 6px;border-bottom:1px solid #ccc;padding-bottom:3px}
        .i{margin:0 0 7px;page-break-inside:avoid}
        .n{font-weight:700}
        .a{color:#222}
        @media print{ @page{margin:12mm} }
      </style></head><body>
      <h1>434 国际商务专业基础 · 一页纸</h1>
      <div style="color:#666;font-size:11px">S 级 + 所有薄弱点 · ${list.length} 条</div>
      ${byMod.map((arr,idx)=>{
        const m = arr[0].m;
        return `<h2>${MODS[m]}</h2>` + arr.map(k=>`
          <div class="i"><span class="n">${k.t}</span>
          <span class="a">${k.a.replace(/\n/g,'　')}</span></div>`).join('');
      }).join('')}
      </body></html>`;

    const w = window.open('', '_blank');
    if(!w){ alert('浏览器拦截了弹窗，请允许弹窗后重试'); return; }
    w.document.write(html);
    w.document.close();
    setTimeout(()=>w.print(), 400);
  };

  MOUNT_PLUGIN({ id:'plan', title:'记忆计划', tab:true, mount(root){ render(root); } });
})();
</script>
<script>
/* ==================================================================
   M4-A  计算专项（参数随机生成，无限练习）
   ================================================================== */
(function(){
  const rnd = (a,b)=> a + Math.random()*(b-a);
  const ri  = (a,b)=> Math.floor(rnd(a, b+1));
  const f2  = x => Math.round(x*100)/100;
  const f4  = x => Math.round(x*10000)/10000;

  /* ---------- 题型生成器 ---------- */
  const TYPES = [

    /* 1. 有效保护率 */
    { key:'erp', name:'有效保护率', id:'t08',
      gen(){
        const P  = ri(120, 300);
        const C  = Math.round(P * rnd(.4, .68));
        const t  = ri(6, 25);
        const tm = ri(0, 15);
        const V  = P - C;
        const V2 = P*(1+t/100) - C*(1+tm/100);
        const erp = (V2 - V) / V * 100;
        return {
          stem:`某最终产品国内价格 ${P} 元，其中原材料成本 ${C} 元。
最终品名义关税 ${t}%，原材料名义关税 ${tm}%。
求该产业的有效保护率（保留两位小数，单位 %）。`,
          ans: f2(erp), unit:'%', tol:x=>Math.max(0.6, Math.abs(x)*0.03),
          steps:[
            `零关税时附加值 V = ${P} − ${C} = ${V} 元`,
            `征税后附加值 V′ = ${P}×1.${String(t).padStart(2,'0')} − ${C}×${(1+tm/100).toFixed(4)} = ${f2(V2)} 元`,
            `有效保护率 E = (V′ − V)/V = (${f2(V2)} − ${V})/${V} = ${f2(erp)}%`,
            `判断：最终品税率 ${t}% ${t>tm?'＞':'＜'} 原材料税率 ${tm}%，所以有效保护率 ${erp>t?'大于':'小于'} 名义税率 ${t}%`
          ]
        };
      }},

    /* 2. 套利净收益 */
    { key:'arb', name:'套利净收益', id:'f12',
      gen(){
        const e  = f4(rnd(6.8, 7.4));
        const idr = ri(3, 6) / 100;
        const ifr = ri(1, 4) / 100;
        const n  = [3,6,12][ri(0,2)];
        const dev = rnd(-0.008, 0.014);            // 远期相对平价的偏离
        const par = e * (1 + idr*n/12) / (1 + ifr*n/12);
        const f  = f4(par * (1 + dev));
        const profit = 100 * (f/e*(1+ifr*n/12) - (1+idr*n/12));  // 万元
        return {
          stem:`即期汇率 USD/CNY = ${e}，${n} 个月远期汇率 = ${f}。
人民币年利率 ${(idr*100).toFixed(2)}%，美元年利率 ${(ifr*100).toFixed(2)}%。
以 100 万元人民币为本金，操作路径固定为：
借人民币 → 即期换成美元 → 美元存款 ${n} 个月 → 远期换回人民币 → 归还本息。
求净利润（万元，保留 3 位小数；亏损则为负）。`,
          ans: Math.round(profit*1000)/1000, unit:'万元',
          tol:x=>Math.max(0.05, Math.abs(x)*0.06),
          steps:[
            `借入本息和 = 100 × (1 + ${(idr*100).toFixed(2)}% × ${n}/12) = ${f2(100*(1+idr*n/12))} 万元`,
            `即期换汇 = 100 / ${e} = ${f4(100/e)} 万美元`,
            `美元存款本息 = ${f4(100/e)} × (1 + ${(ifr*100).toFixed(2)}% × ${n}/12) = ${f4(100/e*(1+ifr*n/12))} 万美元`,
            `远期换回人民币 = ${f4(100/e*(1+ifr*n/12))} × ${f} = ${f2(100/e*(1+ifr*n/12)*f)} 万元`,
            `净利润 = 换回金额 − 本息和 = ${Math.round(profit*1000)/1000} 万元`,
            `结论：${profit>0?'存在套利空间，按此路径可获利':'无套利空间，此路径亏损，反向操作才成立'}`
          ]
        };
      }},

    /* 3. 利率平价求远期汇率 */
    { key:'irp', name:'利率平价求远期', id:'f08',
      gen(){
        const e  = f4(rnd(6.6, 7.5));
        const idr = ri(3, 7) / 100;
        const ifr = ri(1, 5) / 100;
        const n  = [3,6,12][ri(0,2)];
        const f  = e * (1 + idr*n/12) / (1 + ifr*n/12);
        return {
          stem:`即期汇率 USD/CNY = ${e}。
人民币年利率 ${(idr*100).toFixed(2)}%，美元年利率 ${(ifr*100).toFixed(2)}%。
按利率平价理论，求 ${n} 个月远期汇率 USD/CNY（保留 4 位小数）。`,
          ans: f4(f), unit:'', tol:x=>Math.max(0.002, Math.abs(x)*0.002),
          steps:[
            `利率平价：F = S × (1 + i本 × n/12) / (1 + i外 × n/12)`,
            `F = ${e} × (1 + ${(idr*100).toFixed(2)}% × ${n}/12) / (1 + ${(ifr*100).toFixed(2)}% × ${n}/12)`,
            `F = ${e} × ${f4(1+idr*n/12)} / ${f4(1+ifr*n/12)} = ${f4(f)}`,
            `判断：本币利率${idr>ifr?'高于':'低于'}外币利率，美元远期${idr>ifr?'升水':'贴水'}`
          ]
        };
      }},

    /* 4. 相对购买力平价 */
    { key:'ppp', name:'相对购买力平价', id:'f09',
      gen(){
        const e0 = f4(rnd(6.5, 7.6));
        const pd = ri(2, 8) / 100;
        const pf = ri(1, 5) / 100;
        const e1 = e0 * (1 + pd) / (1 + pf);
        return {
          stem:`年初 USD/CNY = ${e0}。
中国当年通货膨胀率 ${(pd*100).toFixed(1)}%，美国 ${(pf*100).toFixed(1)}%。
按相对购买力平价，求年末汇率 USD/CNY（保留 4 位小数）。`,
          ans: f4(e1), unit:'', tol:x=>Math.max(0.002, Math.abs(x)*0.002),
          steps:[
            `相对购买力平价：E₁ = E₀ × (1 + π本) / (1 + π外)`,
            `E₁ = ${e0} × ${f4(1+pd)} / ${f4(1+pf)} = ${f4(e1)}`,
            `判断：本国通胀${pd>pf?'高于':'低于'}外国，本币${pd>pf?'贬值':'升值'}`
          ]
        };
      }}
  ];

  /* ---------- 状态 ---------- */
  const S2 = {type:0, cur:null, done:0, right:0, show:false};

  function next(){
    S2.cur = TYPES[S2.type].gen();
    S2.show = false;
  }

  function render(root){
    if(!S2.cur) next();
    const q = S2.cur;
    const t = TYPES[S2.type];

    root.innerHTML = `
      <h1 class="h1">计算专项</h1>
      <p class="muted">本轮 ${S2.done} 题 · 正确 ${S2.right} 题
        · 正确率 ${S2.done?Math.round(S2.right/S2.done*100):0}%</p>

      <div class="btns" style="margin:12px 0 16px">
        ${TYPES.map((x,i)=>`
          <button class="btn sm ${i===S2.type?'pri':''}" data-t="${i}">${x.name}</button>
        `).join('')}
      </div>

      <div class="panel">
        <div style="font-size:14.5px;line-height:2;white-space:pre-wrap">${q.stem}</div>
      </div>

      <div style="display:flex;gap:10px;align-items:center;margin-top:14px">
        <input id="cin" placeholder="输入答案${q.unit?'（'+q.unit+'）':''}"
          style="flex:1;height:42px;padding:0 14px;border:1px solid var(--line);
                 border-radius:10px;font-size:15px;outline:none">
        <button class="btn pri" id="csub" style="height:42px">提交</button>
        <button class="btn" id="cskip" style="height:42px">看解析</button>
      </div>

      <div id="cout" style="margin-top:16px"></div>`;

    root.querySelectorAll('[data-t]').forEach(b=>{
      b.onclick = ()=>{ S2.type = +b.dataset.t; next(); render(root); };
    });

    const inp = root.querySelector('#cin');
    inp.focus();
    inp.onkeydown = e=>{ if(e.key === 'Enter') submit(root); };
    root.querySelector('#csub').onclick = ()=> submit(root);
    root.querySelector('#cskip').onclick = ()=> reveal(root, null);
  }

  function submit(root){
    const q = S2.cur;
    const raw = root.querySelector('#cin').value.trim().replace(/[，,%\s]/g,'');
    const val = parseFloat(raw);
    if(isNaN(val)){ root.querySelector('#cin').focus(); return; }
    const ok = Math.abs(val - q.ans) <= q.tol(q.ans);

    S2.done++; if(ok) S2.right++;
    Store.answer(TYPES[S2.type].id, ok);
    reveal(root, {ok, val});
  }

  function reveal(root, r){
    const q = S2.cur;
    const out = root.querySelector('#cout');
    const head = r
      ? `<div class="panel" style="border-color:${r.ok?'#bde5c8':'#f3c2c2'};background:${r.ok?'#f7fdf9':'#fffafa'}">
           <b style="color:${r.ok?'var(--ok)':'var(--bad)'}">${r.ok?'✓ 正确':'✗ 不对'}
           </b>　正确答案：<b>${q.ans}${q.unit}</b>
           ${r.ok?'':'　（你答：'+r.val+'）'}
         </div>`
      : `<div class="panel"><b>正确答案：${q.ans}${q.unit}</b></div>`;

    out.innerHTML = head + `
      <div class="panel">
        <h3>解题步骤</h3>
        ${q.steps.map((s,i)=>`
          <div style="display:flex;gap:10px;padding:6px 0;font-size:14px;line-height:1.9">
            <span style="color:var(--pri);font-weight:700;flex:0 0 18px">${i+1}</span>
            <span>${s}</span>
          </div>`).join('')}
      </div>
      <div class="btns">
        <button class="btn pri" id="cnext">下一题</button>
        <button class="btn" id="cagain">同类型再来一题</button>
      </div>`;

    out.querySelector('#cnext').onclick = ()=>{
      S2.type = (S2.type + 1) % TYPES.length;
      next(); render(root);
    };
    out.querySelector('#cagain').onclick = ()=>{ next(); render(root); };
  }

  MOUNT_PLUGIN({ id:'calc', title:'计算专项', tab:true, mount(root){ next(); render(root); } });
})();
</script>
<script>
/* ==================================================================
   M4-B  默写检验
   不给选项、不给提示，直接写；按关键词命中率评分
   ================================================================== */

(function(){

  /* ---------- 评分关键词 ----------
     用 | 分隔同义词，命中任一即可
  ------------------------------------ */
  const KEY = {

    t21:['最惠国','国民待遇','互惠','透明度','例外'],
    t22:['第三国|第三方','无条件','立即','优惠'],
    t23:['最惠国','国民待遇','透明度','市场准入','争端'],
    i01:['市场不完全','垄断优势','海默','金德尔伯格|金德贝格','评价|局限'],
    i02:['所有权','内部化','区位','邓宁','必要条件','充分条件'],
    i03:['小岛清','边际产业','比较劣势','贸易创造','依次'],
    i06:['水平|横向','垂直|纵向','市场','成本|要素','壁垒'],
    i07:['控制权','经营管理权|管理权','创办|新建','再投资'],
    i08:['新建|兴建','控制','周期长','风险','规模'],
    i09:['股份|股权','控制','快速|迅速','整合','溢价|估值'],
    i10:['共同出资','共担风险','股权','当地|本土','冲突'],
    i13:['全球战略','决策','子公司','垄断','竞争力'],
    i14:['法人','控制','有限责任|出资额','独立'],
    i17:['资源','产业转移','技术','出口','空心化|风险'],
    f04:['双挂钩','固定汇率','IMF|国际货币基金','特里芬'],
    f06:['稳定','货币政策','通胀|通货膨胀','投机','储备'],
    f07:['国际收支','通货膨胀|通胀','利率','经济增长','干预'],
    f08:['两个营业日|两日','交割','升水','贴水'],
    f09:['一价定律','购买力','绝对','相对','通胀|通货膨胀'],
    f11:['交易风险','折算风险|会计风险','经济风险','远期|期货|期权','多元化'],
    f12:['利率平价','远期','利差|利率差','套利','本息'],
    f13:['境外|离岸','发行国','欧洲美元','存款'],
    f14:['非居民','境外货币|离岸货币','利率','监管|管制','中心'],
    f15:['外国债券','欧洲债券','扬基','武士','第三国'],
    f17:['并轨','一篮子','中间价','有管理|管理浮动','1994|2005'],
    f18:['钉住','要素流动|要素','蒙代尔','固定','区外'],
    f19:['内部均衡','外部均衡','固定汇率','冲突','紧缩|扩张'],
    o01:['细分','评估','筛选','定位','目标市场'],
    o02:['标准化','差异化|适应','规模经济|成本','文化|需求'],
    o05:['透明','库存','物流|效率','预测','韧性|风险']
  };

  /* ---------- 工具 ---------- */
  const clean = s => String(s).replace(/[^\u4e00-\u9fa5A-Za-z0-9]/g,'');
  function grams(s){
    const t = clean(s), set = new Set();
    for(let i=0;i<t.length-1;i++) set.add(t.slice(i,i+2));
    return set;
  }
  function kwHit(kw, text){
    return kw.split('|').some(alt => text.includes(clean(alt)));
  }

  /* ---------- 状态 ---------- */
  const D = {cur:null, hint:0, onlyS:true, done:0, right:0, res:null};

  function pool(){
    let list = DATA.filter(k => k.a && k.a.length > 20);
    if(D.onlyS) list = list.filter(k => k.lv === 'S');
    return list.length ? list : DATA;
  }
  function pick(){
    const p = pool();
    /* 优先薄弱、优先低掌握度 */
    const scored = p.map(k=>{
      const s = kps(k.id);
      return {k, w: (s.err*3 + (6-s.m)) * (1 + Math.random())};
    }).sort((a,b)=>b.w-a.w);
    return scored[Math.floor(Math.random() * Math.min(6, scored.length))].k;
  }
  function next(){ D.cur = pick(); D.hint = 0; D.res = null; }

  /* ---------- 评分 ---------- */
  function grade(userText){
    const k = D.cur;
    const txt = clean(userText);
    if(!txt) return {score:0, hits:[], miss:[], how:'关键词'};

    const ks = KEY[k.id];
    if(ks){
      const hits = [], miss = [];
      ks.forEach(x => (kwHit(x, txt) ? hits : miss).push(x));
      let score = hits.length / ks.length * 100;
      /* 少于 20 字，视为只写了个开头 */
      if(txt.length < 20) score = Math.min(score, 55);
      return {score, hits, miss, how:'关键词'};
    }
    /* 没有关键词表 → 用二元组覆盖率 */
    const A = grams(k.a), U = grams(userText);
    let c = 0; A.forEach(g => { if(U.has(g)) c++; });
    const recall = A.size ? c / A.size : 0;
    return {score: Math.round(recall * 100), hits:[], miss:[], how:'覆盖率'};
  }

  function record(score){
    const id = D.cur.id;
    if(score >= 80){ Store.answer(id, true); }
    else if(score >= 55){
      const s = kps(id);
      s.seen++; s.ok = 0; s.last = Date.now();
      s.due = Date.now() + 1*DAY;
      Store.save(); Bus.emit('answer', {id, correct:false, mid:true});
    }else{
      Store.answer(id, false);
    }
  }

  /* ---------- 渲染 ---------- */
  function render(root){
    if(!D.cur) next();
    const k = D.cur;
    const s = kps(k.id);

    root.innerHTML = `
      <h1 class="h1">默写检验</h1>
      <p class="muted">本轮 ${D.done} 题 · 达标 ${D.right} 题
        · 不给选项，凭记忆写出来</p>

      <div class="btns" style="margin:12px 0 16px">
        <button class="btn sm ${D.onlyS?'pri':''}" id="tS">只考 S 级</button>
        <button class="btn sm ${!D.onlyS?'pri':''}" id="tAll">全部考点</button>
      </div>

      <div class="panel">
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px">
          <span class="lv ${k.lv.toLowerCase()}">${k.lv}</span>
          <span class="ty">${k.ty}</span>
          <span class="src">${CN[k.m]} · ${k.ch}</span>
          <span class="src">掌握度 ${s.m}/6</span>
        </div>
        <div style="font-size:19px;font-weight:700;line-height:1.6">${k.t}</div>
        <div class="muted" style="margin-top:6px;font-size:12.5px">
          请完整写出它的内容：定义 + 要点 + （如适用）评价。至少 3 个要点。
        </div>
      </div>

      <textarea id="ta" placeholder="在这里默写…（越接近原文得分越高）"
        style="width:100%;height:170px;margin-top:14px;padding:14px;border:1px solid var(--line);
               border-radius:12px;font:14px/1.9 inherit;resize:vertical;outline:none"></textarea>

      <div class="btns">
        <button class="btn pri" id="submit">提交批改</button>
        <button class="btn" id="hint">提示一个关键词（${D.hint}/2）</button>
        <button class="btn" id="skip">不会，看答案</button>
      </div>

      <div id="out" style="margin-top:16px"></div>`;

    const ta = root.querySelector('#ta');
    ta.focus();

    root.querySelector('#tS').onclick = ()=>{ D.onlyS = true; next(); render(root); };
    root.querySelector('#tAll').onclick = ()=>{ D.onlyS = false; next(); render(root); };
    root.querySelector('#submit').onclick = ()=> submit(root);
    root.querySelector('#hint').onclick = ()=>{
      const ks = KEY[k.id];
      if(!ks || D.hint >= 2) return;
      const x = ks[D.hint];
      D.hint++;
      root.querySelector('#out').innerHTML =
        `<div class="panel"><b>提示：</b>${x.split('|')[0]}　<span class="muted">（用了提示，最高只算“模糊”）</span></div>`;
    };
    root.querySelector('#skip').onclick = ()=>{
      D.res = {score:0, hits:[], miss:(KEY[k.id]||[]), how:'放弃'};
      show(root);
    };
  }

  function submit(root){
    const txt = root.querySelector('#ta').value;
    if(!txt.trim()){ root.querySelector('#ta').focus(); return; }
    const r = grade(txt);
    if(D.hint > 0) r.score = Math.min(r.score, 70);
    D.res = r;
    D.done++;
    if(r.score >= 80) D.right++;
    record(r.score);
    show(root);
  }

  function show(root){
    const k = D.cur, r = D.res;
    const lvl = r.score >= 80 ? 'ok' : (r.score >= 55 ? 'mid' : 'bad');
    const label = r.score >= 80 ? '✓ 记住了' : (r.score >= 55 ? '△ 模糊，还要再来' : '✗ 没记住');
    const color = lvl === 'ok' ? 'var(--ok)' : (lvl === 'mid' ? 'var(--warn)' : 'var(--bad)');

    root.querySelector('#out').innerHTML = `
      <div class="panel" style="border-color:${lvl==='ok'?'#bde5c8':(lvl==='mid'?'#f0dcae':'#f3c2c2')}">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <b style="color:${color};font-size:16px">${label}</b>
          <span style="font-size:22px;font-weight:700;color:${color}">${Math.round(r.score)}<span
            style="font-size:12px;font-weight:400;color:#727b8f"> 分</span></span>
        </div>
        <div style="margin-top:8px;font-size:12.5px" class="muted">
          评分方式：${r.how}
        </div>
      </div>

      ${r.hits.length || r.miss.length ? `
      <div class="panel">
        <h3>关键词命中</h3>
        <div style="display:flex;flex-wrap:wrap;gap:7px">
          ${r.hits.map(x=>`<span style="background:#f2fbf5;border:1px solid #bde5c8;color:#166534;
            padding:4px 10px;border-radius:8px;font-size:12.5px">✓ ${x.split('|')[0]}</span>`).join('')}
          ${r.miss.map(x=>`<span style="background:#fff6f6;border:1px solid #f3c2c2;color:#991b1b;
            padding:4px 10px;border-radius:8px;font-size:12.5px">✗ ${x.split('|')[0]}</span>`).join('')}
        </div>
      </div>`:''}

      <div class="panel">
        <h3>标准答案</h3>
        <div style="font-size:14.5px;line-height:2;white-space:pre-wrap">${k.a}</div>
      </div>

      <div class="btns">
        <button class="btn pri" id="nextq">下一题</button>
        <button class="btn" id="retry">再默一遍</button>
        <button class="btn ok" id="force">我其实记住了</button>
      </div>`;

    root.querySelector('#nextq').onclick = ()=>{ next(); render(root); };
    root.querySelector('#retry').onclick = ()=>{
      const k2 = D.cur;
      D.res = null;
      render(root);
      root.querySelector('#ta').value = '';
    };
    root.querySelector('#force').onclick = ()=>{ Store.markMastered(k.id); next(); render(root); };
  }

  MOUNT_PLUGIN({ id:'write', title:'默写检验', tab:true, mount(root){ next(); render(root); } });
})();
</script>

 q:'波特的国家竞争优势理论（钻石模型）',a:'一国某产业的国际竞争优势由四个基本因素与两个辅助因素决定：\n①生产要素（初级/高级、一般/特殊）；②需求条件；③相关与支持性产业；④企业战略、结构与竞争；\n辅助：机遇与政府。\n评价：从企业与国家层面解释竞争优势来源，突破传统要素禀赋视角；但忽视跨国公司的作用。'},
{id:'ta04',m:0,ch:'第1章 国际贸易理论',t:'技术差距论',lv:'B',ty:'名解',src:'—',
 q:'技术差距论（波斯纳）',a:'技术先进国发明新产品并出口，技术模仿国需经过需求滞后、反应滞后、掌握滞后三个时滞后才能模仿生产，期间形成技术差距贸易。随着技术扩散，贸易逐渐消失。'},
{id:'ta05',m:0,ch:'第1章 国际贸易理论',t:'要素价格均等化定理',lv:'B',ty:'名解',src:'—',
 q:'要素价格均等化定理（H-O-S）',a:'在要素禀赋论的全部假设下，自由贸易通过商品相对价格均等化，使各国同质要素的相对价格与绝对报酬趋于均等。由萨缪尔森发展。'},
{id:'ta06',m:0,ch:'第1章 国际贸易理论',t:'斯托尔珀-萨缪尔森定理',lv:'B',ty:'名解',src:'—',
 q:'斯托尔珀-萨缪尔森定理',a:'某商品相对价格上升，将提高该商品密集使用的生产要素的实际报酬，降低另一要素的实际报酬。即贸易会提高丰裕要素所有者的收入、降低稀缺要素所有者的收入。'},
{id:'ta07',m:0,ch:'第1章 国际贸易理论',t:'罗伯津斯基定理',lv:'B',ty:'名解',src:'—',
 q:'罗伯津斯基定理',a:'在商品相对价格不变的前提下，某一要素增加会使密集使用该要素的部门产量增加，另一部门产量下降。适用于小国情形。'},
{id:'ta08',m:0,ch:'第1章 国际贸易理论',t:'悲惨增长',lv:'B',ty:'名解',src:'—',
 q:'悲惨增长（贫困化增长）',a:'一国出口部门要素增加、产量扩大，导致出口品国际价格大幅下跌，贸易条件严重恶化，出口收入反而下降，福利水平低于增长前。'},
{id:'ta09',m:0,ch:'第1章 国际贸易理论',t:'荷兰病',lv:'B',ty:'名解',src:'—',
 q:'荷兰病',a:'一国某一初级产品部门（如石油、天然气）异常繁荣，导致劳动力和资本大量流入该部门，制造业因成本上升而萎缩，形成资源产业繁荣牺牲其他部门的产业结构失衡现象。'},
{id:'ta10',m:0,ch:'第1章 国际贸易理论',t:'贸易条件',lv:'B',ty:'名解',src:'17名解',
 q:'贸易条件',a:'一国出口商品价格与进口商品价格之比，又称进出口交换比价。贸易条件指数＝出口价格指数÷进口价格指数×100，大于100表示改善，小于100表示恶化。'},
{id:'ta11',m:0,ch:'第1章 国际贸易理论',t:'对外贸易乘数',lv:'B',ty:'名解',src:'20简答',
 q:'对外贸易乘数',a:'开放经济中，出口增加带动国民收入成倍增长的倍数。等于边际储蓄倾向与边际进口倾向之和的倒数。前提是二者之和小于1，此时增加出口可提高有效需求与就业。'},
{id:'ta12',m:0,ch:'第1章 国际贸易理论',t:'幼稚产业保护论',lv:'A',ty:'名解',src:'—',
 q:'幼稚产业保护论（李斯特）',a:'后起国家应对处于成长初期、尚不具备竞争力的幼稚产业实行暂时保护，待其成长壮大后再参与自由贸易。保护手段以关税为主，且应有期限、有选择。'},
{id:'ta13',m:0,ch:'第1章 国际贸易理论',t:'超保护贸易理论',lv:'A',ty:'简答',src:'22论述',
 q:'凯恩斯的超保护贸易理论',a:'以有效需求不足为出发点，认为贸易顺差能增加有效需求、扩大就业，且具有乘数效应；逆差则相反。因此主张奖出限入。\n评价：突破了传统自由贸易理论；但易引发报复，且长期顺差会因外汇流入推高物价、削弱竞争力。'},
{id:'ta14',m:0,ch:'第1章 国际贸易理论',t:'中心-外围论',lv:'B',ty:'名解',src:'—',
 q:'中心-外围论（普雷维什）',a:'世界经济分为以发达国家构成的“中心”和发展中国家构成的“外围”。中心出口工业品、外围出口初级产品，贸易条件长期不利于外围，形成结构性依附。主张外围国家实行进口替代工业化。'},
{id:'ta15',m:0,ch:'第1章 国际贸易理论',t:'保护就业论',lv:'B',ty:'简答',src:'—',
 q:'保护就业论',a:'主张限制进口以保护本国就业。微观上保护某行业即增加该行业就业；宏观上以凯恩斯有效需求理论为依据。缺陷：忽视他国报复、忽略出口部门就业损失、长期损害购买力。'},
{id:'ta16',m:0,ch:'第1章 国际贸易理论',t:'保护公平竞争论',lv:'B',ty:'简答',src:'—',
 q:'保护公平竞争论',a:'认为出口补贴、倾销、压低工资、操纵汇率、侵犯知识产权等属不公平竞争，应以反补贴税、反倾销税、限额等手段反制。缺陷：易被滥用为保护借口，引发反报复。'},

/* ---------- 国际贸易 · 概念与分类 ---------- */
{id:'ta17',m:0,ch:'第5章 国际分工与世界市场',t:'国际分工',lv:'A',ty:'名解',src:'—',
 q:'国际分工',a:'世界各国之间的劳动分工，是生产国际专业化。它是一国国民经济内部分工超越国家界限的结果。影响因素：生产力（决定性）、自然条件、跨国公司与资本输出、上层建筑。'},
{id:'ta18',m:0,ch:'第5章 国际分工与世界市场',t:'当代国际分工新特点',lv:'A',ty:'简答',src:'17论述',
 q:'当代国际分工发展的新特点',a:'①新技术使传统分工格局削弱，发达国家成为农产品主要出口国；②各国产业结构相互依赖加深；③区域集团内部产业分工日趋紧密；④技术密集型产业加快向发展中国家转移；⑤服务分工成为重要形式；⑥分工机制从殖民强制转向市场与政府协调。'},
{id:'ta19',m:0,ch:'第5章 国际分工与世界市场',t:'世界市场',lv:'B',ty:'名解',src:'—',
 q:'世界市场',a:'由国际分工联系起来的各国之间以商品流通和劳务交换为主要内容的交换活动总和。战后特点：规模空前扩大、垄断与竞争并存、内部市场扩大、信息网络完善、自由化趋势。'},
{id:'ta20',m:0,ch:'第5章 国际分工与世界市场',t:'对外贸易依存度',lv:'A',ty:'名解',src:'23名解',
 q:'对外贸易依存度',a:'一国进出口总额占GDP（或GNP）的比重，反映该国对国际市场的依赖程度与对外开放程度。可细分为出口依存度与进口依存度。'},
{id:'ta21',m:0,ch:'第5章 国际分工与世界市场',t:'总贸易与专门贸易',lv:'B',ty:'名解',src:'—',
 q:'总贸易与专门贸易',a:'总贸易以国境为统计标准，进入国境即列为进口，离开国境即列为出口。专门贸易以关境为标准，只有进入关境才列为专门进口，运出关境列为专门出口。'},
{id:'ta22',m:0,ch:'第5章 国际分工与世界市场',t:'转口贸易 / 过境贸易',lv:'B',ty:'名解',src:'—',
 q:'转口贸易与过境贸易',a:'转口贸易：商品经第三国转手，第三国分别与生产国、消费国发生交易关系。过境贸易：商品经第三国国境运往他国，对过境国既非进口也非出口。'},
{id:'ta23',m:0,ch:'第5章 国际分工与世界市场',t:'水平贸易与垂直贸易',lv:'B',ty:'名解',src:'14名解',
 q:'水平贸易与垂直贸易',a:'水平贸易：经济发展水平相近国家之间的贸易。垂直贸易：经济发展水平不同国家之间的贸易，多为发达国家与发展中国家之间的工业品与初级产品交换。'},
{id:'ta24',m:0,ch:'第5章 国际分工与世界市场',t:'易货贸易',lv:'B',ty:'名解',src:'—',
 q:'易货贸易',a:'以经过计价的货物作为清偿工具的贸易，进出口直接结合，双方均有进有出，可节省外汇并保持贸易平衡。'},
{id:'ta25',m:0,ch:'第3章 货物与服务贸易',t:'加工贸易',lv:'B',ty:'名解',src:'—',
 q:'加工贸易',a:'进口原料、材料或零部件，利用本国生产能力和技术加工成成品后再出口，获取以 外汇体现的附加价值。形式包括进料加工、来料加工、装配业务与协作生产。'},
{id:'ta26',m:0,ch:'第3章 货物与服务贸易',t:'服务贸易（广义/狭义）',lv:'A',ty:'名解',src:'23简答',
 q:'国际服务贸易（广义与狭义）',a:'狭义：以服务产品区别于货物的特性为界定标准，须同时具备生产消费同时性、不可贮藏、非实体形态，且符合严格贸易概念。广义：以国际收支统计为依据，经常项目与资本项目下除商品贸易与无偿转让外一切引起国际收支的实际往来，含资本报酬（利息、股息、利润）。'},
{id:'ta27',m:0,ch:'第3章 货物与服务贸易',t:'服务贸易的特点',lv:'A',ty:'简答',src:'23简答',
 q:'国际服务贸易的特点',a:'①生产与消费同时发生，不可分离；②服务难以贮存、易逝；③服务无形，交易完成后消失；④贸易标的多为无形产品，海关统计难以覆盖；⑤涉及人员、资本等要素跨境流动。'},
{id:'ta28',m:0,ch:'第3章 货物与服务贸易',t:'技术贸易',lv:'B',ty:'名解',src:'—',
 q:'国际技术贸易',a:'政府机构或企业之间按商业条件签订技术协议或合同，进行有偿技术转让。包括工业产权技术（专利、商标）与专有技术。方式：许可证贸易、技术咨询、合作生产、工程承包。'},
{id:'ta29',m:0,ch:'第3章 货物与服务贸易',t:'许可证贸易',lv:'B',ty:'名解',src:'—',
 q:'许可证贸易',a:'技术许可方将其专利、商标或专有技术的使用权通过协议转让给技术接受方，是国际技术贸易最主要、最基本的方式。可单独许可，也可混合许可。'},
{id:'ta30',m:0,ch:'第3章 货物与服务贸易',t:'交钥匙工程',lv:'B',ty:'名解',src:'—',
 q:'交钥匙工程',a:'跨国公司为东道国建造工厂或工程项目，完成设计、施工、设备安装、试车并顺利运转后，将所有权与管理权完整移交对方经营。可视为特殊形式的管理合同。'},
{id:'ta31',m:0,ch:'第3章 货物与服务贸易',t:'数字贸易',lv:'A',ty:'论述',src:'24论述',
 q:'数字贸易及其发展意义',a:'以数字技术为手段、以数据为关键要素的贸易活动，包括数字产品贸易、数字服务贸易与数字技术支撑的货物贸易。\n意义：①降低交易成本、拓展市场边界；②推动服务可贸易化；③促进产业数字化升级；④提升中小企业的出口能力。\n挑战：数据跨境流动规则、数字税、平台垄断、数字鸿沟。'},

/* ---------- 国际贸易 · 政策与壁垒 ---------- */
{id:'ta32',m:0,ch:'第2章 贸易政策与壁垒',t:'关税及其特点',lv:'A',ty:'名解',src:'—',
 q:'关税及其特点',a:'进出口商品经过一国关境时，由海关向进出口商征收的税。特点：①间接税，税负转嫁给消费者；②税收主体是本国进出口商；③税收客体是进出口商品；④由海关征收。作用：财政、保护、协调、外交。'},
{id:'ta33',m:0,ch:'第2章 贸易政策与壁垒',t:'从价税 / 混合税',lv:'B',ty:'名解',src:'—',
 q:'从价税、混合税、选择税',a:'从价税：按进口商品价格计征，税额＝商品总值×从价税率。混合税：同时按从价与从量计征。选择税：对同一商品规定从价与从量两种税率，择高或择低征收。'},
{id:'ta34',m:0,ch:'第2章 贸易政策与壁垒',t:'关税水平',lv:'B',ty:'名解',src:'—',
 q:'关税水平',a:'一国平均进口税率，衡量关税高低与保护程度。算法有简单平均法与加权平均法，后者以进口值或数量为权数，更合理。'},
{id:'ta35',m:0,ch:'第2章 贸易政策与壁垒',t:'关税配额',lv:'B',ty:'名解',src:'—',
 q:'关税配额',a:'预先规定一定时期内的进口配额，配额内适用优惠税率或免税，超过配额则适用普通税率或征收附加税，是关税与配额结合的非关税措施。分全球配额与国别配额。'},
{id:'ta36',m:0,ch:'第2章 贸易政策与壁垒',t:'自动出口配额',lv:'B',ty:'名解',src:'—',
 q:'“自动”出口配额制',a:'出口国在进口国要求或压力下，“自动”规定一定时期内某商品对该国的出口配额，限额内自行控制出口，超限即禁止出口。分非协定与协定两种形式。'},
{id:'ta37',m:0,ch:'第2章 贸易政策与壁垒',t:'进口许可证制',lv:'B',ty:'名解',src:'—',
 q:'进口许可证制',a:'进口商须向政府主管部门申请并取得许可证，方可进口特定商品，是直接限制进口数量的非关税措施。分自动与非自动许可证。'},
{id:'ta38',m:0,ch:'第2章 贸易政策与壁垒',t:'外汇管制',lv:'S',ty:'简答',src:'19简答·21',
 q:'外汇管制及其限制进口的作用',a:'一国政府通过法令对国际结算、外汇买卖和资本流动实行限制。类型：①数量性外汇管制（限额分配）；②成本性外汇管制（复汇率）；③混合性。\n限制进口的机制：进口商须申请外汇，审批环节可拖延或拒批，直接抑制进口付汇能力；复汇率下对进口用汇适用高汇率，抬高进口成本。'},
{id:'ta39',m:0,ch:'第2章 贸易政策与壁垒',t:'技术性贸易壁垒',lv:'A',ty:'名解',src:'—',
 q:'技术性贸易壁垒',a:'以国家或地区的技术法规、标准、认证体系等形式出现，涵盖技术、卫生、检疫、安全、环保、质量等指标，名目繁多、灵活多变，披着合法外衣，是最隐蔽、最难对付的非关税壁垒。WTO 相关协定为 TBT 与 SPS。'},
{id:'ta40',m:0,ch:'第2章 贸易政策与壁垒',t:'碳关税',lv:'B',ty:'名解',src:'—',
 q:'碳关税',a:'主权国家或地区对高耗能产品进口征收的二氧化碳排放特别关税，主要针对铝、钢铁、水泥、玻璃等碳密集型产品，实质是新型绿色贸易壁垒。'},
{id:'ta41',m:0,ch:'第2章 贸易政策与壁垒',t:'反倾销税',lv:'A',ty:'名解',src:'—',
 q:'反倾销税',a:'对实行倾销的进口商品征收的进口附加税，目的是抵消倾销的不利影响。构成倾销须同时满足：低于正常价值销售、对国内产业造成实质损害或威胁、二者存在因果关系。税额不超过倾销差额。'},
{id:'ta42',m:0,ch:'第2章 贸易政策与壁垒',t:'反补贴税',lv:'A',ty:'名解',src:'17',
 q:'反补贴税',a:'为抵消商品在生产、制造、加工、买卖及输出过程中直接或间接接受的补贴而征收的临时附加税。条件：补贴确实存在、国内产业受到实质损害、二者有因果关系，税额不超过补贴额。'},
{id:'ta43',m:0,ch:'第2章 贸易政策与壁垒',t:'普惠制',lv:'B',ty:'名解',src:'—',
 q:'普惠制（GSP）',a:'发达国家对发展中国家出口的制成品与半制成品给予普遍优惠的减税制度。三原则：普遍性、非歧视性、非互惠性。'},
{id:'ta44',m:0,ch:'第2章 贸易政策与壁垒',t:'保障措施',lv:'A',ty:'名解',src:'—',
 q:'保障措施',a:'当某类产品进口大量增加，对国内同类产业造成严重损害或严重威胁且存在因果关系时，进口国可实施的临时性进口限制。属 WTO 例外条款，须遵循非歧视原则并给予补偿。'},
{id:'ta45',m:0,ch:'第2章 贸易政策与壁垒',t:'出口退税',lv:'B',ty:'名解',src:'—',
 q:'出口退税',a:'政府将出口商品的原料进口税及国内生产流转环节已缴税款全部或部分退还给出口商，以降低出口成本、提高竞争力。合理性在于出口商品未在国内消费，不应重复征税。'},
{id:'ta46',m:0,ch:'第2章 贸易政策与壁垒',t:'出口信贷国家担保制',lv:'B',ty:'名解',src:'—',
 q:'出口信贷国家担保制',a:'国家设立专门机构，对本国出口商或商业银行向外国进口商或银行提供的贷款予以担保，当外国债务人拒付时按承保数额补偿。承保政治风险与经济风险。'},
{id:'ta47',m:0,ch:'第2章 贸易政策与壁垒',t:'经济特区',lv:'B',ty:'名解',src:'—',
 q:'经济特区',a:'实行特殊经济贸易政策的地区，通常划在关境以外，通过减免关税、提供良好基础设施等优惠，吸引外资与技术，发展转口贸易与出口加工。类型：自由贸易区、出口加工区、综合型、科技型、保税区、过境区。'},
{id:'ta48',m:0,ch:'第2章 贸易政策与壁垒',t:'出口加工区',lv:'B',ty:'名解',src:'—',
 q:'出口加工区',a:'专门为加工、制造、装配出口产品而开辟的特定区域，是自由贸易区转口功能弱化、加工功能强化的产物，面向工业，一般设在关境以内并给予税收优惠。'},
{id:'ta49',m:0,ch:'第2章 贸易政策与壁垒',t:'保税区',lv:'B',ty:'名解',src:'—',
 q:'保税区',a:'经海关批准注册、受海关监管的特定区域。商品可自由进出并暂不缴纳进口税，再出口免出口税；若进入国内市场销售则须补缴进口税。可储存、改装、分类、展览与加工。'},
{id:'ta50',m:0,ch:'第2章 贸易政策与壁垒',t:'出口管制',lv:'B',ty:'简答',src:'—',
 q:'出口管制及其方式',a:'国家以保护政治、经济、安全利益为由，限制某些商品出口。目的：政治军事目的、经济目的。对象：战略物资与尖端技术、国内紧缺原材料、被要求自动限制的商品、制裁对象国、文物、垄断商品。方式：单方面管制（专营、出口税、许可证、配额、禁运）与多边管制（瓦森纳协定）。'},

/* ---------- 国际贸易 · 区域与多边 ---------- */
{id:'ta51',m:0,ch:'第4章 区域一体化与 WTO',t:'关税同盟理论',lv:'S',ty:'论述',src:'15论述',
 q:'关税同盟的静态效应与动态效应',a:'静态效应：贸易创造（福利增加）、贸易转移（福利损失），净福利取决于二者差额。\n动态效应：①获得规模经济；②加剧竞争、打破垄断；③刺激投资（含绕过关税的“关税工厂”）；④促进技术进步；⑤提高要素流动性；⑥促进经济增长。'},
{id:'ta52',m:0,ch:'第4章 区域一体化与 WTO',t:'大市场理论',lv:'B',ty:'名解',src:'—',
 q:'大市场理论',a:'认为保护贸易把市场分割得狭小缺乏弹性，无法实现规模经济。共同市场把分散的小市场统一成大市场，通过内部激烈竞争实现大批量生产利益。核心：获得规模经济、依靠市场扩大带来的竞争激化。'},
{id:'ta53',m:0,ch:'第4章 区域一体化与 WTO',t:'协议性国际分工',lv:'B',ty:'名解',src:'—',
 q:'协议性国际分工（小岛清）',a:'在两国经济发展阶段相近、资源禀赋差异不大的条件下，通过相互提供市场的协议实现规模经济与成本递减，而非依靠比较优势与竞争。三个条件：发展阶段相近、对象商品可获规模经济、专业化利益差别不大。'},
{id:'ta54',m:0,ch:'第4章 区域一体化与 WTO',t:'共同市场',lv:'B',ty:'名解',src:'—',
 q:'共同市场',a:'在成员间取消关税与非关税壁垒、建立对外统一关税的基础上，还允许资本、劳动力等生产要素自由流动的一体化形式。要求成员让渡关税制定权、技术标准制定权、间接税调整权等。'},
{id:'ta55',m:0,ch:'第4章 区域一体化与 WTO',t:'经济同盟',lv:'B',ty:'名解',src:'—',
 q:'经济同盟',a:'成员间商品与要素自由流动、对外统一关税，并制定执行共同的经济政策与社会政策，让渡宏观经济政策干预权（含财政、货币与汇率政策），是较高层次的一体化。'},
{id:'ta56',m:0,ch:'第4章 区域一体化与 WTO',t:'RCEP',lv:'S',ty:'论述',src:'25论述',
 q:'RCEP 的经济效应及对中国的影响',a:'经济效应：①关税削减与非关税壁垒消除，降低区域内贸易成本；②原产地累积规则促进区域内产业链整合；③投资便利化提升外资吸引力；④服务贸易与电子商务开放。\n对中国：①巩固亚太产业链核心地位；②制造业与日韩产业链衔接更紧；③农产品获得市场准入；④数字贸易规则助力平台企业出海；⑤挑战：部分低端产业外迁、规则标准压力。'},
{id:'ta57',m:0,ch:'第4章 区域一体化与 WTO',t:'一带一路',lv:'B',ty:'论述',src:'—',
 q:'“一带一路”倡议的经济意义',a:'①基础设施互联互通，降低贸易成本；②拓展出口市场与产能合作空间；③推动人民币区域化；④促进中西部开放与区域均衡；⑤风险：债务可持续性、地缘政治、投资回报周期长。'},
{id:'ta58',m:0,ch:'第4章 区域一体化与 WTO',t:'自由贸易试验区',lv:'A',ty:'简答',src:'24简答',
 q:'中国设立自贸试验区的意义',a:'①制度创新试验田：负面清单、准入前国民待遇、贸易便利化；②压力测试：为全国推广积累经验；③吸引高端要素与总部经济；④推动服务业开放；⑤倒逼政府职能转变与营商环境优化。'},
{id:'ta59',m:0,ch:'第4章 区域一体化与 WTO',t:'贸易便利化',lv:'A',ty:'名解',src:'—',
 q:'贸易便利化',a:'通过简化程序与手续、协调法律法规、标准化与改善基础设施，为国际贸易创造协调、透明、可预见的环境。核心是海关与跨境制度。'},
{id:'ta60',m:0,ch:'第4章 区域一体化与 WTO',t:'投资便利化',lv:'S',ty:'名解',src:'25名解',
 q:'投资便利化',a:'各国政府通过优化政策、简化行政程序、提高法律透明度与服务质量，减少外资进入与运营障碍，促进 FDI 增长。核心是提高投资效率、增强投资环境吸引力，同时兼顾国家安全与可持续发展。RCEP、CPTPP 均含相关条款。'},
{id:'ta61',m:0,ch:'第4章 区域一体化与 WTO',t:'国民待遇',lv:'A',ty:'名解',src:'—',
 q:'国民待遇',a:'一成员对另一成员的产品、服务、服务提供者及知识产权持有人提供的待遇，不低于本国同类对象享有的待遇。与最惠国待遇共同构成非歧视原则。'},
{id:'ta62',m:0,ch:'第4章 区域一体化与 WTO',t:'多哈回合',lv:'B',ty:'名解',src:'—',
 q:'多哈回合',a:'WTO 于 2001 年启动的新一轮多边贸易谈判，又称发展回合，议题包括农业、非农产品市场准入、服务贸易、规则谈判、争端解决、知识产权、环境与发展。因发达成员与发展中成员在农业补贴等问题上分歧严重而长期停滞。'},
{id:'ta63',m:0,ch:'第4章 区域一体化与 WTO',t:'贸易制裁',lv:'B',ty:'名解',src:'—',
 q:'贸易制裁',a:'一国或国家集团为达到政治或经济目的，对另一国采取的贸易限制措施，如禁运、提高关税、取消最惠国待遇、限制技术出口等。'},

/* ---------- 国际投资 ---------- */
{id:'ia01',m:1,ch:'第1章 FDI 与跨国公司理论',t:'国际间接投资',lv:'A',ty:'名解',src:'—',
 q:'国际间接投资',a:'投资者通过购买外国股票、债券等有价证券或提供贷款进行的投资，目的是获取利息、股息等资本收益，不涉及对企业经营控制权的取得。'},
{id:'ia02',m:1,ch:'第1章 FDI 与跨国公司理论',t:'资产选择理论',lv:'B',ty:'名解',src:'—',
 q:'资产选择理论（马科维茨）',a:'投资者不应只追求收益，而应综合权衡收益与风险，通过持有多种有价证券形成有效组合以分散风险。选择标准：平均收益率一定时取风险最小者，风险一定时取收益最高者。核心是“不要把鸡蛋放在一个篮子里”。'},
{id:'ia03',m:1,ch:'第1章 FDI 与跨国公司理论',t:'麦克杜格尔模型',lv:'B',ty:'论述',src:'—',
 q:'麦克杜格尔模型（国际资本流动的福利分析）',a:'假设世界资本总量不变、仅两国、资本由平均收益决定流向。资本自由流动后，资本从丰裕国流向短缺国，两国资本的边际生产率趋于相等，世界总产出增加，投资国与东道国均获益。缺陷：假设过于简化，忽略技术、制度与风险因素。'},
{id:'ia04',m:1,ch:'第5章 投资环境与风险管理',t:'冷热对比分析法',lv:'B',ty:'名解',src:'—',
 q:'冷热对比分析法',a:'1968 年由利特法克与班廷提出，从投资者立场选定七项因素（政治稳定性、市场机会、经济发展与成就、文化一体化、法令阻碍、实质阻碍、地理文化差距），对目标国由“热”到“冷”排序，热国表示投资环境优良。'},
{id:'ia05',m:1,ch:'第5章 投资环境与风险管理',t:'投资环境等级评分法',lv:'B',ty:'名解',src:'—',
 q:'投资环境等级评分法（斯托伯）',a:'从东道国政府对外资的限制与鼓励政策着眼，选取币值稳定、通胀率、资本外调、外资持股比例、差别待遇、政治稳定、当地资本供应、关税保护态度八项因素评分，加总得投资环境总分。'},
{id:'ia06',m:1,ch:'第5章 投资环境与风险管理',t:'道氏评估法',lv:'B',ty:'名解',src:'—',
 q:'道氏评估法（动态分析法）',a:'道氏公司把投资风险分为正常企业风险（竞争风险）与环境风险，并把影响环境的因素分为企业业务条件与可能引起其变化的主要压力，通过动态评估判断未来环境变化。'},
{id:'ia07',m:1,ch:'第5章 投资环境与风险管理',t:'富兰德指数',lv:'B',ty:'名解',src:'—',
 q:'富兰德指数（FL）',a:'由汉厄尔设计、美国商业环境风险情报所编制的国家风险指数：FL＝政府风险指数×50%＋商业环境指数×25%＋政治风险指数×25%，0—100 分，分值越高风险越低。'},
{id:'ia08',m:1,ch:'第3章 跨国公司',t:'跨国战略联盟',lv:'S',ty:'论述',src:'22论述',
 q:'跨国战略联盟的目的与动机',a:'两个或以上企业为实现共同战略目标而结成的合作、共担风险、共享利益的联合行动。\n动机：①优势互补、分摊研发成本与风险；②绕开贸易壁垒、快速进入市场；③获取规模经济与学习效应；④应对技术标准竞争；⑤降低政治与管制风险。\n风险：技术外溢、伙伴机会主义、管理协调成本高。'},
{id:'ia09',m:1,ch:'第3章 跨国公司',t:'全球战略',lv:'B',ty:'名解',src:'—',
 q:'全球战略',a:'跨国公司从全球角度配置资源、安排经营活动，以全球市场为单位追求规模经济、区位经济与学习效应，通过集权管理获得成本优势。适用于成本压力大、地区调适压力小的情形。'},
{id:'ia10',m:1,ch:'第3章 跨国公司',t:'多国战略',lv:'B',ty:'名解',src:'—',
 q:'多国战略',a:'又称本土化战略，把战略重点放在各国差异上，通过提高对东道国市场需求的适应能力扩大份额，子公司自主经营、适当自给自足。适用于地区调适压力高、成本压力低的情形。'},
{id:'ia11',m:1,ch:'第1章 FDI 与跨国公司理论',t:'诱发要素组合理论',lv:'S',ty:'简答',src:'16简答',
 q:'发展中国家跨国公司投资的诱发要素组合理论',a:'对外直接投资由直接诱发要素与间接诱发要素组合推动。\n①直接诱发要素：技术、资本、管理、劳动力等生产要素，本国不具备时可通过对外投资到国外获取；\n②间接诱发要素：东道国投资环境、政策法规、基础设施，母国政策与双边协定，以及全球经济环境。\n意义：解释了不具备垄断优势的发展中国家为何也能对外投资。'},
{id:'ia12',m:1,ch:'第1章 FDI 与跨国公司理论',t:'小规模技术理论',lv:'B',ty:'名解',src:'—',
 q:'小规模技术理论（威尔斯）',a:'发展中国家跨国公司的优势来自：①为小市场服务的小规模生产技术；②当地采购与低成本劳动力；③民族产品与低价营销。这些优势使其能在发达国家企业不愿进入的小市场生存。'},
{id:'ia13',m:1,ch:'第1章 FDI 与跨国公司理论',t:'技术地方化理论',lv:'B',ty:'名解',src:'—',
 q:'技术地方化理论（拉奥）',a:'发展中国家企业对引进技术进行改造、消化与再创新，形成适应当地要素价格与市场需求的“地方化”技术优势，从而具备对外投资能力。'},
{id:'ia14',m:1,ch:'第1章 FDI 与跨国公司理论',t:'雁行模式',lv:'B',ty:'名解',src:'—',
 q:'雁行模式（赤松要）',a:'后起国通过“国外引进—国内生产—产品出口”的循环实现产业结构升级，形成类似雁阵的产业转移序列。山泽逸平扩展为引进、进口替代、出口成长、成熟、逆进口五阶段。'},
{id:'ia15',m:1,ch:'第4章 母国与东道国效应',t:'产业空心化',lv:'B',ty:'名解',src:'—',
 q:'产业空心化',a:'一国对外直接投资过度发展，制造业生产与就业大量转移海外，国内实体经济相对萎缩、产业基础削弱的现 象。是母国对外投资的潜在代价之一。'},
{id:'ia16',m:1,ch:'第4章 母国与东道国效应',t:'对外直接投资的东道国效应',lv:'A',ty:'论述',src:'—',
 q:'对外直接投资对东道国的影响',a:'积极：①弥补资本缺口，扩大资本形成；②带来技术与管理的溢出；③创造就业（直接与间接）；④促进出口与产业升级；⑤改善国际收支。\n消极：①利润汇回造成资本账户压力；②挤占本地市场、抑制本地企业成长；③转移定价导致税收流失；④可能形成对关键产业的依附。'},
{id:'ia17',m:1,ch:'第3章 跨国公司',t:'网络分布指数',lv:'B',ty:'名解',src:'—',
 q:'网络分布指数（NDI）',a:'反映跨国公司经营所涉东道国数量的指标：NDI＝N/N*×100%，N 为海外分支机构所在国家数，N* 为世界上有 FDI 输入的国家数（扣除母国）。'},
{id:'ia18',m:1,ch:'第3章 跨国公司',t:'跨国银行',lv:'B',ty:'名解',src:'—',
 q:'跨国银行',a:'在多个国家设立分支机构、经营国际金融业务的银行。主要形式：代表处、分行、子银行、附属银行、合资银行。作用：为跨国公司提供全球融资、结算与资金调拨服务。'},
{id:'ia19',m:1,ch:'第2章 FDI 类型与决策',t:'外商直接投资',lv:'A',ty:'名解',src:'—',
 q:'外商直接投资（FDI）',a:'外国投资者在本国境内以现金、实物、技术等投资设立企业，或并购境内企业股权达到一定比例以上，从而取得经营控制权的投资。形式：独资、合资、合作、并购、利润再投资。'},
{id:'ia20',m:1,ch:'第2章 FDI 类型与决策',t:'独资经营',lv:'B',ty:'名解',src:'—',
 q:'独资经营',a:'外国投资者在东道国单独出资设立企业，独立经营、自负盈亏，全部股权归投资者所有。优点是控制力强、技术不易外溢；缺点是资金压力大、风险自担、易受东道国限制。'},
{id:'ia21',m:1,ch:'第2章 FDI 类型与决策',t:'BOT',lv:'B',ty:'名解',src:'—',
 q:'BOT（建设—经营—转让）',a:'东道国政府将基础设施项目的建设与经营权特许给外国投资者，由其融资建设并在约定期限内经营收费，期满后无偿移交东道国政府。属国际灵活投资方式。'},
{id:'ia22',m:1,ch:'第2章 FDI 类型与决策',t:'特许经营',lv:'B',ty:'名解',src:'—',
 q:'国际特许经营',a:'特许方将其商标、商号、经营模式、技术等以合同形式授予受许方使用，受许方支付特许费并按统一标准经营。属非股权式的国际灵活投资方式。'},
{id:'ia23',m:1,ch:'第5章 投资环境与风险管理',t:'国际投资环境',lv:'A',ty:'名解',src:'22名解',
 q:'国际投资环境',a:'在国际投资过程中影响跨国企业生产经营活动的各种外部条件或因素相互依赖、相互制约所形成的有机统一体。特点：综合性、系统性、动态性。内容：自然、经济、政治、法律、社会文化环境。'},
{id:'ia24',m:1,ch:'第5章 投资环境与风险管理',t:'国家风险',lv:'B',ty:'名解',src:'—',
 q:'国家风险',a:'由于东道国政治、经济、社会或法律环境变化，导致外国投资者资产受损或收益不确定的可能性。主要包括政治风险、汇兑风险、征用风险与战争风险。'},
{id:'ia25',m:1,ch:'第1章 FDI 与跨国公司理论',t:'市场内部化',lv:'B',ty:'名解',src:'—',
 q:'市场内部化',a:'由于中间产品（技术、知识、管理技能）市场不完全、交易成本高且难以定价，企业以内部组织替代外部市场，将交易转入企业内部完成，以降低交易成本、保护垄断优势。'}
);

<script>

   M5-B  考点扩充：国际金融（42）＋ 商务运营（26）
